plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.godnit.taskcity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.taskcity'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-native'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Intentionally empty: Android framework + OpenGL ES only.
    // This keeps the APK small and avoids game engines / WebView runtimes.
}
