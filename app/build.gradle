plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.godnit.taskcity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.taskcity'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.filament:filament-android:1.75.0'
    implementation 'com.google.android.filament:gltfio-android:1.75.0'
    implementation 'com.google.android.filament:filament-utils-android:1.75.0'
}
