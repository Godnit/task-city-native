plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.godnit.taskcity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.taskcity'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1-libgdx'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def gdxVersion = '1.13.1'

configurations {
    natives
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doLast {
        delete file('src/main/jniLibs')
        configurations.natives.files.each { jar ->
            String abi = null
            if (jar.name.contains('natives-armeabi-v7a')) abi = 'armeabi-v7a'
            else if (jar.name.contains('natives-arm64-v8a')) abi = 'arm64-v8a'
            else if (jar.name.contains('natives-x86_64')) abi = 'x86_64'
            else if (jar.name.contains('natives-x86')) abi = 'x86'
            if (abi != null) {
                def outDir = file("src/main/jniLibs/$abi")
                outDir.mkdirs()
                copy {
                    from zipTree(jar)
                    into outDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyAndroidNatives')
}
