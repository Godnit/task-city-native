plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.godnit.handgesturecube'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.handgesturecube'
        minSdk 26
        targetSdk 35
        // Higher than v1.9 so Android can install this build over it.
        versionCode 12
        versionName '1.3-fast'

        // x86 is only for the Android 8.1 CI emulator; the delivery APK strips it.
        ndk {
            abiFilters 'armeabi-v7a', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    // Stable release already validated on Android 8.1 in the later builds.
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
