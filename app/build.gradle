plugins {
    id 'com.android.application'
}

android {
    namespace 'com.godnit.taskcity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.taskcity'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
