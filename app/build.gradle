plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.godnit.ourempire'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.ourempire'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/empire/AndroidManifest.xml'
            java.srcDirs = ['src/empire/java']
            res.srcDirs = ['src/empire/res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies { }
