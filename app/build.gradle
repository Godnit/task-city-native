plugins {
    id "com.android.application"
}

android {
    namespace "com.godnit.taskcity"
    compileSdk 35

    defaultConfig {
        applicationId "com.godnit.taskcity"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
