name: Build XAU Lab 2.0.0 Native

on:
  push:
    branches: [ xau-lab-native-v2 ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct native Kotlin project
        shell: bash
        run: |
          set -euo pipefail
          cat native-v2/source-part*.b64 > /tmp/xau-native-v2.b64
          base64 -d /tmp/xau-native-v2.b64 > /tmp/xau-native-v2.tar.xz
          echo 'f373d6f7e4ddcd0ec2c99aabfebe20ae6e8b98273c2022375630e4f87011dee8  /tmp/xau-native-v2.tar.xz' | sha256sum -c -
          rm -rf native-src && mkdir native-src
          tar -xJf /tmp/xau-native-v2.tar.xz -C native-src
          python native-v2/fix-compile-1.py native-src
          test -s native-src/app/src/main/java/com/maimon/xaulab/MainActivity.kt
          grep -q "versionName '2.0.0'" native-src/app/build.gradle
          grep -q 'versionCode 31' native-src/app/build.gradle

      - name: Enforce pure native Android
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'WebView|android\.webkit|JavascriptInterface|evaluateJavascript|loadUrl\(' native-src/app/src/main; then
            echo 'WebView/web bridge code is forbidden in native v2' >&2
            exit 1
          fi
          if find native-src -type f \( -name '*.html' -o -name '*.htm' -o -name '*.js' \) | grep -q .; then
            echo 'HTML/JavaScript files are forbidden in native v2' >&2
            exit 1
          fi
          test ! -d native-src/app/src/main/assets || test -z "$(find native-src/app/src/main/assets -type f -print -quit)"

      - name: Android lint QA
        working-directory: native-src
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:lintRelease --stacktrace

      - name: Build native release APK
        working-directory: native-src
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Inspect compiled APK for forbidden web runtime
        shell: bash
        run: |
          set -euo pipefail
          unzip -l native-src/app/build/outputs/apk/release/app-release-unsigned.apk > /tmp/apk-list.txt
          if grep -Ei '\.(html|htm|js)$' /tmp/apk-list.txt; then
            echo 'Web assets unexpectedly packaged' >&2
            exit 1
          fi
          unzip -p native-src/app/build/outputs/apk/release/app-release-unsigned.apk classes.dex > /tmp/classes.dex
          if strings /tmp/classes.dex | grep -E 'Landroid/webkit/WebView;|android/webkit/WebView|JavascriptInterface|evaluateJavascript' ; then
            echo 'WebView runtime unexpectedly compiled into app' >&2
            exit 1
          fi

      - name: Collect build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp native-src/app/build/outputs/apk/release/app-release-unsigned.apk artifact/XAU-Lab-v2.0.0-native-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$BT/lib/apksigner.jar" artifact/apksigner.jar
          if test -x "$BT/aapt"; then "$BT/aapt" dump badging artifact/XAU-Lab-v2.0.0-native-unsigned.apk > artifact/badging.txt; fi
          cp native-src/app/build/reports/lint-results-release.html artifact/lint-results-release.html || true
          (cd native-src && zip -qr ../artifact/XAU-Lab-v2.0.0-native-source.zip . -x 'app/build/*' '.gradle/*')
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Lab-v2.0.0-native-build
          path: artifact/
          if-no-files-found: error
