name: Build Network Academy APK
on:
  push:
    branches: [ network-academy-v1 ]
    paths:
      - 'network-academy/**'
      - '.github/workflows/build-network-academy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: network-academy
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAcademy-APK
          path: network-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
