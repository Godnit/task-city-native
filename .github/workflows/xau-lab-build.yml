name: Build XAU Lab 1.18.0 unsigned

on:
  push:
    branches: [ xau-lab-build-1-18 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct verified XAU 1.16 source
        shell: bash
        run: |
          set -euo pipefail
          cat xau-src-parts/* > /tmp/xau-source.b64
          base64 -d /tmp/xau-source.b64 > /tmp/xau-source.tar.xz
          echo 'ef98eb889a43a7110add831c92ec96556af0ec4e302976dfd208d03ab48f4ead  /tmp/xau-source.tar.xz' | sha256sum -c -
          rm -rf xau-build-src
          mkdir -p xau-build-src
          tar -xJf /tmp/xau-source.tar.xz -C xau-build-src
          test -f xau-build-src/app/src/main/assets/app.js
          test -f xau-build-src/app/src/main/java/com/maimon/xaulab/MainActivity.java

      - name: Apply XAU 1.17 base update
        shell: bash
        run: |
          set -euo pipefail
          cat xau-v117-patch2/* > /tmp/v117.patch
          cd xau-build-src
          patch --batch -p1 < /tmp/v117.patch || true
          test ! -s app/src/main/assets/app.js.rej
          test ! -s app/src/main/assets/index.html.rej
          test ! -s app/src/main/assets/app.css.rej
          grep -q "versionName '1.17.0'" app/build.gradle
          grep -q 'function placeManualOrderFromModal' app/src/main/assets/app.js

      - name: Apply verified XAU 1.18 Meta terminal update
        shell: bash
        run: |
          set -euo pipefail
          echo '0219ebb6d7b5ecb128a4a144eec6da70fe64b8e29f775938a51c0136ae17de0a  xau-v118.patch.xz' | sha256sum -c -
          xz -dc xau-v118.patch.xz > /tmp/v118.patch
          cd xau-build-src
          patch --batch -p1 < /tmp/v118.patch || true
          test ! -s app/build.gradle.rej
          test ! -s app/src/main/assets/app.js.rej
          test ! -s app/src/main/assets/index.html.rej
          test ! -s app/src/main/assets/app.css.rej
          test ! -s app/src/main/java/com/maimon/xaulab/MainActivity.java.rej
          grep -q "versionName '1.18.0'" app/build.gradle
          grep -q "versionCode 19" app/build.gradle
          grep -q 'var LIVE_POLL_MS = 350' app/src/main/assets/app.js
          grep -q 'function placeQuickMarket' app/src/main/assets/app.js
          grep -q 'function updateManualLevel' app/src/main/assets/app.js
          grep -q 'needsLiveTerminal' app/src/main/assets/app.js
          grep -q 'id="quickTradeBar"' app/src/main/assets/index.html
          grep -q 'id="timeframeMenuButton"' app/src/main/assets/index.html
          grep -q 'id="positionQuickPanel"' app/src/main/assets/index.html
          test -s tools/test-meta-ui-v118.js

      - name: Install and build vendor bundle
        working-directory: xau-build-src
        run: |
          npm ci
          npm run build:vendor
          test -s app/src/main/assets/vendor-data.min.js

      - name: Validate XAU 1.18 logic
        working-directory: xau-build-src
        run: |
          node --check app/src/main/assets/app.js
          if test -f tools/test-chart-core.js; then node tools/test-chart-core.js; fi
          if test -f tools/test-live-data.js; then node tools/test-live-data.js; fi
          if test -f tools/test-visual-robot.js; then node tools/test-visual-robot.js; fi
          if test -f tools/test-account.js; then node tools/test-account.js; fi
          if test -f tools/test-manual-trading.js; then node tools/test-manual-trading.js; fi
          node tools/test-meta-ui-v118.js

      - name: Build unsigned release APK
        working-directory: xau-build-src
        run: |
          gradle :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp xau-build-src/app/build/outputs/apk/release/app-release-unsigned.apk artifact/XAU-Lab-v1.18.0-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Using build tools: $BT"
          test -s "$BT/lib/apksigner.jar"
          cp "$BT/lib/apksigner.jar" artifact/apksigner.jar
          if test -x "$BT/aapt"; then "$BT/aapt" dump badging artifact/XAU-Lab-v1.18.0-unsigned.apk > artifact/badging.txt; fi
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Lab-v1.18.0-unsigned-and-apksigner
          path: artifact/
          if-no-files-found: error
