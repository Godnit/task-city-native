name: Build XAU Lab 1.17.0 unsigned

on:
  push:
    branches: [ xau-lab-build-1-17 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct verified XAU 1.16 source
        shell: bash
        run: |
          set -euo pipefail
          cat xau-src-parts/* > /tmp/xau-source.b64
          base64 -d /tmp/xau-source.b64 > /tmp/xau-source.tar.xz
          echo 'ef98eb889a43a7110add831c92ec96556af0ec4e302976dfd208d03ab48f4ead  /tmp/xau-source.tar.xz' | sha256sum -c -
          rm -rf xau-build-src
          mkdir -p xau-build-src
          tar -xJf /tmp/xau-source.tar.xz -C xau-build-src
          test -f xau-build-src/app/src/main/assets/app.js
          test -f xau-build-src/app/src/main/java/com/maimon/xaulab/MainActivity.java

      - name: Apply XAU 1.17 update
        shell: bash
        run: |
          set -euo pipefail
          cat xau-v117-patch/* > /tmp/v117.patch
          cd xau-build-src
          patch -p1 < /tmp/v117.patch
          grep -q "versionName '1.17.0'" app/build.gradle
          grep -q "versionCode 18" app/build.gradle
          grep -q "Meta-style solid candles" app/src/main/assets/app.js

      - name: Install and build vendor bundle
        working-directory: xau-build-src
        run: |
          npm ci
          npm run build:vendor
          test -s app/src/main/assets/vendor-data.min.js

      - name: Validate XAU 1.17 logic
        working-directory: xau-build-src
        run: |
          node --check app/src/main/assets/app.js
          node tools/test-chart-core.js
          node tools/test-live-data.js
          node tools/test-visual-robot.js
          node tools/test-account.js
          node tools/test-manual-trading.js

      - name: Build unsigned release APK
        working-directory: xau-build-src
        run: |
          gradle :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK and signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp xau-build-src/app/build/outputs/apk/release/app-release-unsigned.apk artifact/XAU-Lab-v1.17.0-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Using build tools: $BT"
          test -s "$BT/lib/apksigner.jar"
          cp "$BT/lib/apksigner.jar" artifact/apksigner.jar
          if test -x "$BT/aapt"; then "$BT/aapt" dump badging artifact/XAU-Lab-v1.17.0-unsigned.apk > artifact/badging.txt; fi
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Lab-v1.17.0-unsigned-and-apksigner
          path: artifact/
          if-no-files-found: error
