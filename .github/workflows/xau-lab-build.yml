name: Build XAU Lab 1.16.0

on:
  push:
    branches: [ xau-lab-build-1-16 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack XAU Lab source
        run: |
          rm -rf xau-build
          mkdir -p xau-build
          unzip -q xau-android-build.zip -d xau-build
          test -f xau-build/app/src/main/AndroidManifest.xml
          test -f xau-build/app/src/main/assets/app.js

      - name: Validate JavaScript
        run: node --check xau-build/app/src/main/assets/app.js

      - name: Build debug APK
        working-directory: xau-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s xau-build/app/build/outputs/apk/debug/app-debug.apk
          ls -lh xau-build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Lab-v1.16.0-APK
          path: xau-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
