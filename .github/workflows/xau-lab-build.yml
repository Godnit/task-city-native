name: Build XAU Lab 1.19.0 unsigned

on:
  push:
    branches: [ xau-lab-build-1-19 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct verified XAU 1.16 source
        shell: bash
        run: |
          set -euo pipefail
          cat xau-src-parts/* > /tmp/xau-source.b64
          base64 -d /tmp/xau-source.b64 > /tmp/xau-source.tar.xz
          echo 'ef98eb889a43a7110add831c92ec96556af0ec4e302976dfd208d03ab48f4ead  /tmp/xau-source.tar.xz' | sha256sum -c -
          rm -rf xau-build-src
          mkdir -p xau-build-src
          tar -xJf /tmp/xau-source.tar.xz -C xau-build-src

      - name: Apply XAU 1.17 base update
        shell: bash
        run: |
          set -euo pipefail
          cat xau-v117-patch2/* > /tmp/v117.patch
          cd xau-build-src
          patch --batch -p1 < /tmp/v117.patch || true
          test ! -s app/src/main/assets/app.js.rej
          test ! -s app/src/main/assets/index.html.rej
          test ! -s app/src/main/assets/app.css.rej
          grep -q "versionName '1.17.0'" app/build.gradle

      - name: Apply verified XAU 1.18 update
        shell: bash
        run: |
          set -euo pipefail
          echo '0219ebb6d7b5ecb128a4a144eec6da70fe64b8e29f775938a51c0136ae17de0a  xau-v118.patch.xz' | sha256sum -c -
          xz -dc xau-v118.patch.xz > /tmp/v118.patch
          cd xau-build-src
          patch --batch -p1 < /tmp/v118.patch || true
          test ! -s app/build.gradle.rej
          test ! -s app/src/main/assets/app.js.rej
          test ! -s app/src/main/assets/index.html.rej
          test ! -s app/src/main/assets/app.css.rej
          test ! -s app/src/main/java/com/maimon/xaulab/MainActivity.java.rej
          grep -q "versionName '1.18.0'" app/build.gradle

      - name: Apply XAU 1.19 UI and accounts update
        shell: bash
        run: |
          set -euo pipefail
          cd xau-build-src
          python ../xau-v119-patch.py
          grep -q "versionName '1.19.0'" app/build.gradle
          grep -q 'versionCode 20' app/build.gradle
          grep -q 'id="accountMenuButton"' app/src/main/assets/index.html
          grep -q 'id="quickLot" type="text"' app/src/main/assets/index.html
          grep -q 'v1.19 multi-account manager' app/src/main/assets/app.js
          grep -q 'saveQuickLotV119' app/src/main/assets/app.js
          grep -q 'new-order-button hidden' app/src/main/assets/index.html

      - name: Install and build vendor bundle
        working-directory: xau-build-src
        run: |
          npm ci
          npm run build:vendor
          test -s app/src/main/assets/vendor-data.min.js

      - name: Validate XAU 1.19 logic
        working-directory: xau-build-src
        run: |
          node --check app/src/main/assets/app.js
          if test -f tools/test-chart-core.js; then node tools/test-chart-core.js; fi
          if test -f tools/test-live-data.js; then node tools/test-live-data.js; fi
          if test -f tools/test-visual-robot.js; then node tools/test-visual-robot.js; fi
          if test -f tools/test-account.js; then node tools/test-account.js; fi
          if test -f tools/test-manual-trading.js; then node tools/test-manual-trading.js; fi
          if test -f tools/test-meta-ui-v118.js; then node tools/test-meta-ui-v118.js; fi
          python - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text()
          j=Path('app/src/main/assets/app.js').read_text()
          assert h.index('id="quickTradeBar"') > h.index('meta-compact-toolbar')
          assert 'type="number"' not in h[h.index('id="quickLot"')-80:h.index('id="quickLot"')+160]
          assert 'STORAGE.accounts' in j and 'switchAccountV119' in j
          print('v1.19 checks passed')
          PY

      - name: Build unsigned release APK
        working-directory: xau-build-src
        run: |
          gradle :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Collect APK source and signing tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp xau-build-src/app/build/outputs/apk/release/app-release-unsigned.apk artifact/XAU-Lab-v1.19.0-unsigned.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -s "$BT/lib/apksigner.jar"
          cp "$BT/lib/apksigner.jar" artifact/apksigner.jar
          if test -x "$BT/aapt"; then "$BT/aapt" dump badging artifact/XAU-Lab-v1.19.0-unsigned.apk > artifact/badging.txt; fi
          (cd xau-build-src && zip -qr ../artifact/XAU-Lab-v1.19.0-source.zip . -x 'node_modules/*' 'app/build/*' '.gradle/*')
          sha256sum artifact/* > artifact/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAU-Lab-v1.19.0-build
          path: artifact/
          if-no-files-found: error
