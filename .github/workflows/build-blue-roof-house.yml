name: Build Blue Roof House 3D

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/blue_roof_house/**'
      - '.github/workflows/build-blue-roof-house.yml'

jobs:
  build-house:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Build house geometry
        run: |
          mkdir -p output/blue-roof-house
          blender -b --python tools/blue_roof_house/build_house.py -- --output output/blue-roof-house || true
          test -s output/blue-roof-house/blue_roof_cottage.blend

      - name: Export GLB and render preview
        run: |
          blender -b output/blue-roof-house/blue_roof_cottage.blend \
            --python tools/blue_roof_house/export_and_render.py \
            -- --output output/blue-roof-house
          test -s output/blue-roof-house/blue_roof_cottage.glb
          test -s output/blue-roof-house/blue_roof_cottage_preview.png
          ls -lh output/blue-roof-house

      - name: Upload 3D house artifact
        uses: actions/upload-artifact@v4
        with:
          name: blue-roof-cottage-3d
          path: output/blue-roof-house/*
          if-no-files-found: error
          retention-days: 30
