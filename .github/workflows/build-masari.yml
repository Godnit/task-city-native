name: Build Masari APK

on:
  push:
    branches: [masari-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: base64 -d masari/signing/masari-release.keystore.b64 > masari/signing/masari-release.keystore

      - name: Prepare source compatibility
        run: |
          sed -i 's/private int soft(int c)/private static int soft(int c)/' masari/app/src/main/java/com/masari/personalplan/MasariV12Activity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('masari/app/src/main/java/com/masari/personalplan/MasariV17Activity.java')
          s=p.read_text()
          old='for(String d:reviewDomains)addDomainProgress(dom,d);'
          new='for(String d:reviewDomains)addDomainProgress(domains,d);'
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: masari
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose masari/app/build/outputs/apk/release/app-release.apk
          unzip -t masari/app/build/outputs/apk/release/app-release.apk

      - name: Prepare named APK
        run: cp masari/app/build/outputs/apk/release/app-release.apk Masari-v0.18.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masari-v0.18.0
          path: Masari-v0.18.0.apk
          if-no-files-found: error
          retention-days: 30
