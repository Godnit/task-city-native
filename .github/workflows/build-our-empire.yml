name: Build Our Empire Arabic APK

on:
  push:
    branches: [our-empire-ar-v01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Bundle optimized offline map data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p empireapp/src/main/assets .map-src
          BASE="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson"
          FALLBACK="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson"
          fetch_map() {
            local file="$1"
            if ! curl -L --fail --retry 3 --retry-delay 2 "$BASE/$file" -o ".map-src/$file"; then
              curl -L --fail --retry 3 --retry-delay 2 "$FALLBACK/$file" -o ".map-src/$file"
            fi
          }
          fetch_map ne_50m_admin_0_countries.geojson
          if ! curl -L --fail --retry 2 "$BASE/ne_10m_admin_1_states_provinces_lines.geojson" -o .map-src/admin1.geojson; then
            curl -L --fail --retry 3 "$FALLBACK/ne_50m_admin_1_states_provinces_lakes.geojson" -o .map-src/admin1.geojson
          fi
          fetch_map ne_50m_populated_places_simple.geojson

          python3 - <<'PY'
          import json, pathlib, math
          root=pathlib.Path('.map-src')
          out=pathlib.Path('empireapp/src/main/assets')

          def load(path): return json.loads(path.read_text(encoding='utf-8'))
          def rounded(x):
              if isinstance(x,float): return round(x,4)
              if isinstance(x,list): return [rounded(v) for v in x]
              if isinstance(x,dict): return {k:rounded(v) for k,v in x.items()}
              return x
          def point_line_distance(p,a,b):
              ax,ay=a[:2]; bx,by=b[:2]; px,py=p[:2]
              dx=bx-ax; dy=by-ay
              if dx==0 and dy==0:return math.hypot(px-ax,py-ay)
              t=max(0.0,min(1.0,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy)))
              return math.hypot(px-(ax+t*dx),py-(ay+t*dy))
          def rdp(points,eps):
              if len(points)<=2:return points
              a,b=points[0],points[-1]; idx=-1; md=-1.0
              for i in range(1,len(points)-1):
                  d=point_line_distance(points[i],a,b)
                  if d>md:idx=i;md=d
              if md>eps and idx>0:return rdp(points[:idx+1],eps)[:-1]+rdp(points[idx:],eps)
              return [a,b]
          def simplify_ring(r,eps):
              if len(r)<5:return r
              closed=r[0][:2]==r[-1][:2]; core=r[:-1] if closed else r; s=rdp(core,eps)
              if len(s)<3:s=core[:3]
              return s+[s[0]] if closed else s
          def simplify_geom(g,eps=.04):
              if not g:return g
              t=g.get('type'); c=g.get('coordinates')
              if t=='LineString':return {'type':t,'coordinates':rdp(c,eps)}
              if t=='MultiLineString':return {'type':t,'coordinates':[rdp(x,eps) for x in c if len(x)>=2]}
              if t=='Polygon':return {'type':t,'coordinates':[simplify_ring(r,eps) for r in c if len(r)>=4]}
              if t=='MultiPolygon':return {'type':t,'coordinates':[[simplify_ring(r,eps) for r in p if len(r)>=4] for p in c]}
              return g
          def write_js(name,var,obj):
              text='window.%s=%s;'%(var,json.dumps(obj,ensure_ascii=False,separators=(',',':')))
              (out/name).write_text(text,encoding='utf-8'); print(name,len(text),'bytes')

          countries=load(root/'ne_50m_admin_0_countries.geojson')
          keys=('ADM0_A3','ISO_A3','SOV_A3','GU_A3','BRK_A3','POSTAL','NAME_AR','ADMIN','NAME_EN','NAME')
          cf=[]
          for f in countries.get('features',[]):
              p=f.get('properties') or {}
              cf.append({'type':'Feature','properties':{k:p.get(k) for k in keys if p.get(k) not in (None,'')},'geometry':rounded(f.get('geometry'))})
          write_js('map_countries.js','NE_COUNTRIES',{'type':'FeatureCollection','features':cf})

          admin=load(root/'admin1.geojson'); af=[]
          for f in admin.get('features',[]):
              g=f.get('geometry')
              if g:af.append({'type':'Feature','properties':{},'geometry':rounded(simplify_geom(g,.04))})
          write_js('map_admin1.js','NE_ADMIN1',{'type':'FeatureCollection','features':af})

          raw=load(root/'ne_50m_populated_places_simple.geojson'); feats=[]
          for f in raw.get('features',[]):
              p=f.get('properties') or {}; g=f.get('geometry')
              if not g or g.get('type')!='Point':continue
              rr=p.get('SCALERANK',p.get('scalerank',9))
              try:rank=float(rr)
              except:rank=9
              if rank>8:continue
              props={'ADM0_A3':p.get('ADM0_A3') or p.get('adm0_a3'),'SOV_A3':p.get('SOV_A3') or p.get('sov_a3'),'NAME_AR':p.get('NAME_AR') or p.get('name_ar'),'NAME':p.get('NAME') or p.get('name'),'NAMEPAR':p.get('NAMEPAR') or p.get('namepar'),'NAMEASCII':p.get('NAMEASCII') or p.get('nameascii'),'SCALERANK':rr}
              props={k:v for k,v in props.items() if v not in (None,'')}
              feats.append({'type':'Feature','properties':props,'geometry':rounded(g)})
          feats.sort(key=lambda f:float(f['properties'].get('SCALERANK',9)))
          write_js('map_cities.js','NE_CITIES',{'type':'FeatureCollection','features':feats[:1200]})
          PY

          node --check empireapp/src/main/assets/phase2-map.js
          node --check empireapp/src/main/assets/phase6-camera.js
          test -s empireapp/src/main/assets/map_countries.js
          test -s empireapp/src/main/assets/map_admin1.js
          test -s empireapp/src/main/assets/map_cities.js
          test "$(stat -c%s empireapp/src/main/assets/map_cities.js)" -gt 50000
          test "$(stat -c%s empireapp/src/main/assets/map_admin1.js)" -lt 5000000

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: |
          rm -rf empireapp/build .gradle
          gradle --no-daemon --no-build-cache :empireapp:assembleRelease

      - name: Verify APK and map assets
        run: |
          test -f empireapp/build/outputs/apk/release/empireapp-release.apk
          unzip -t empireapp/build/outputs/apk/release/empireapp-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose empireapp/build/outputs/apk/release/empireapp-release.apk
          unzip -l empireapp/build/outputs/apk/release/empireapp-release.apk | grep 'assets/phase6-camera.js'
          unzip -l empireapp/build/outputs/apk/release/empireapp-release.apk | grep 'assets/map_countries.js'
          unzip -l empireapp/build/outputs/apk/release/empireapp-release.apk | grep 'assets/map_admin1.js'
          unzip -l empireapp/build/outputs/apk/release/empireapp-release.apk | grep 'assets/map_cities.js'

      - name: Prepare named APK
        run: cp empireapp/build/outputs/apk/release/empireapp-release.apk Our-Empire-Arabic-v0.6-CachedMap.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Our-Empire-Arabic-v0.6-CachedMap
          path: Our-Empire-Arabic-v0.6-CachedMap.apk
          if-no-files-found: error
          retention-days: 30
