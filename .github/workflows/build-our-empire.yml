name: Build Our Empire Arabic APK

on:
  push:
    branches: [our-empire-ar-v01]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare named APK
        run: cp app/build/outputs/apk/release/app-release.apk Our-Empire-Arabic-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Our-Empire-Arabic-v0.1
          path: Our-Empire-Arabic-v0.1.apk
          if-no-files-found: error
          retention-days: 30
