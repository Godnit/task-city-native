name: Build Task City Android 8 APK

on:
  push:
    branches: [task-city-v0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable prototype signing key
        run: base64 -d taskcity-release.keystore.b64 > taskcity-release.keystore

      - name: Patch ES2 shader precision for Android 8 GPUs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/godnit/taskcity/CityRenderer.kt')
          s = p.read_text()
          old = 'private val VERTEX_SHADER = """\n            uniform mat4 uModel;'
          new = 'private val VERTEX_SHADER = """\n            precision mediump float;\n            uniform mat4 uModel;'
          if old not in s:
              raise SystemExit('Vertex shader marker not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release package
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.godnit.taskcity'" apk-badging.txt
          grep -q "sdkVersion:'26'" apk-badging.txt
          unzip -t "$APK"

      - name: Prepare named APK
        run: cp app/build/outputs/apk/release/app-release.apk Task-City-v0.1-Android8.apk

      - name: Android 8.1 real-launch smoke test and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.godnit.taskcity
            adb shell am start -W -n com.godnit.taskcity/.MainActivity
            sleep 8
            adb shell dumpsys activity activities > activity.txt
            adb shell screencap -p /sdcard/task-city-preview.png
            adb pull /sdcard/task-city-preview.png task-city-preview.png
            adb logcat -d -v time > task-city-logcat.txt
            adb shell pidof com.godnit.taskcity
            grep -q 'com.godnit.taskcity' activity.txt
            ! grep -A20 'FATAL EXCEPTION' task-city-logcat.txt | grep -q 'com.godnit.taskcity'

      - name: Upload APK and Android 8.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Task-City-v0.1-Android8
          path: |
            Task-City-v0.1-Android8.apk
            task-city-preview.png
            apk-badging.txt
            task-city-logcat.txt
            activity.txt
          if-no-files-found: warn
          retention-days: 30
