name: Build Psychology Academy APK
on:
  push:
    branches: [ psychology-academy-v1 ]
    paths:
      - 'psychology-academy/**'
      - '.github/workflows/build-psychology-academy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate academy
        run: |
          node --check psychology-academy/app/src/main/assets/data.js
          node --check psychology-academy/app/src/main/assets/app.js
          node --check psychology-academy/app/src/main/assets/visual-v2.js
          node --check psychology-academy/app/src/main/assets/final-v4.js
          grep -q '19 قسم' psychology-academy/app/src/main/assets/app.js
          grep -q 'مختبر العقل' psychology-academy/app/src/main/assets/app.js
          grep -q 'data-theme="light"' psychology-academy/app/src/main/assets/app.css
          grep -q 'data-theme="light"' psychology-academy/app/src/main/assets/visual-v2.css
          grep -q 'body\[data-theme="light"\]' psychology-academy/app/src/main/assets/final-v4.css
          grep -q 'stageIconFinal' psychology-academy/app/src/main/assets/final-v4.js
          grep -q 'ملاحظة علمية وموضع خلاف' psychology-academy/app/src/main/assets/final-v4.js
          grep -q 'قسّم الفكرة' psychology-academy/app/src/main/assets/final-v4.js
          grep -q 'كيف نعرف ذلك علميًا' psychology-academy/app/src/main/assets/final-v4.js
          grep -q 'final-v4.js' psychology-academy/app/src/main/assets/index.html
          ! grep -q 'teaching-v3.js' psychology-academy/app/src/main/assets/index.html
          ! grep -q 'تخيل أنني' psychology-academy/app/src/main/assets/final-v4.js
          ! grep -q 'شرح الأستاذ' psychology-academy/app/src/main/assets/final-v4.js
          grep -q 'أساسيات الصحة النفسية' psychology-academy/app/src/main/assets/data.js
          grep -q 'علم نفس اللغة والفصاحة' psychology-academy/app/src/main/assets/data.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: psychology-academy
        run: gradle --no-daemon assembleDebug
      - name: Verify APK contents
        run: |
          APK=psychology-academy/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/data.js'
          unzip -l "$APK" | grep -q 'assets/app.js'
          unzip -l "$APK" | grep -q 'assets/app.css'
          unzip -l "$APK" | grep -q 'assets/visual-v2.js'
          unzip -l "$APK" | grep -q 'assets/visual-v2.css'
          unzip -l "$APK" | grep -q 'assets/final-v4.js'
          unzip -l "$APK" | grep -q 'assets/final-v4.css'
          unzip -l "$APK" | grep -q 'classes.dex'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychologyAcademy-v4-Final
          path: psychology-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
