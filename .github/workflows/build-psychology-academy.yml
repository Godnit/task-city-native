name: Build Psychology Academy APK
on:
  push:
    branches: [ psychology-academy-v1 ]
    paths:
      - 'psychology-academy/**'
      - '.github/workflows/build-psychology-academy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate academy
        run: |
          node --check psychology-academy/app/src/main/assets/data.js
          node --check psychology-academy/app/src/main/assets/app.js
          node --check psychology-academy/app/src/main/assets/visual-v2.js
          node --check psychology-academy/app/src/main/assets/final-v4.js
          node --check psychology-academy/app/src/main/assets/brand-v5.js
          node --check psychology-academy/app/src/main/assets/ux-content-v7.js
          grep -q 'ux-content-v7.js' psychology-academy/app/src/main/assets/index.html
          grep -q 'ux-content-v7.css' psychology-academy/app/src/main/assets/index.html
          grep -q '3 أمثلة' psychology-academy/app/src/main/assets/ux-content-v7.js
          grep -q 'الدرس التالي' psychology-academy/app/src/main/assets/ux-content-v7.js
          grep -q 'ابحث عن درس أو مسار' psychology-academy/app/src/main/assets/ux-content-v7.js
          grep -q 'psychology-icon-v6.webp' psychology-academy/app/src/main/assets/brand-v5.js
          grep -q 'android:icon="@drawable/psychology_icon"' psychology-academy/app/src/main/AndroidManifest.xml
          ! grep -q 'teaching-v3.js' psychology-academy/app/src/main/assets/index.html
          grep -q 'أساسيات الصحة النفسية' psychology-academy/app/src/main/assets/data.js
          grep -q 'علم نفس اللغة والفصاحة' psychology-academy/app/src/main/assets/data.js
          test $(find psychology-academy/app/src/main/assets -name 'psychology-icon-v6.part*' | wc -l) -eq 8
      - name: Reconstruct exact selected icon
        run: |
          cat psychology-academy/app/src/main/assets/psychology-icon-v6.part* | base64 -d > psychology-academy/app/src/main/assets/psychology-icon-v6.webp
          echo '731734843bdf750efd8fb187e45259a607d820514c81ffe67826740493d08e03  psychology-academy/app/src/main/assets/psychology-icon-v6.webp' | sha256sum -c -
          file psychology-academy/app/src/main/assets/psychology-icon-v6.webp | grep -qi 'Web/P'
          test $(stat -c%s psychology-academy/app/src/main/assets/psychology-icon-v6.webp) -eq 28790
          mkdir -p psychology-academy/app/src/main/res/drawable
          cp psychology-academy/app/src/main/assets/psychology-icon-v6.webp psychology-academy/app/src/main/res/drawable/psychology_icon.webp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: psychology-academy
        run: gradle --no-daemon assembleDebug
      - name: Verify APK v7 and exact launcher icon
        run: |
          APK=psychology-academy/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/data.js'
          unzip -l "$APK" | grep -q 'assets/psychology-icon-v6.webp'
          unzip -l "$APK" | grep -q 'assets/brand-v5.js'
          unzip -l "$APK" | grep -q 'assets/ux-content-v7.js'
          unzip -l "$APK" | grep -q 'assets/ux-content-v7.css'
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -p "$APK" assets/psychology-icon-v6.webp | sha256sum | grep -q '^731734843bdf750efd8fb187e45259a607d820514c81ffe67826740493d08e03'
          unzip -p "$APK" assets/index.html | grep -q 'ux-content-v7.js'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q 'application-icon'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q 'أكاديمية علم النفس'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychologyAcademy-v7-LessonsNavigation
          path: psychology-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
