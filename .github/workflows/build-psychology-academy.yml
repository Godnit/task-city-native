name: Build Psychology Academy APK
on:
  push:
    branches: [ psychology-academy-v1 ]
    paths:
      - 'psychology-academy/**'
      - '.github/workflows/build-psychology-academy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate academy
        run: |
          node --check psychology-academy/app/src/main/assets/data.js
          node --check psychology-academy/app/src/main/assets/app.js
          node --check psychology-academy/app/src/main/assets/visual-v2.js
          node --check psychology-academy/app/src/main/assets/final-v4.js
          node --check psychology-academy/app/src/main/assets/brand-v5.js
          grep -q '19 قسم' psychology-academy/app/src/main/assets/app.js
          grep -q 'مختبر العقل' psychology-academy/app/src/main/assets/app.js
          grep -q 'data-theme="light"' psychology-academy/app/src/main/assets/app.css
          grep -q 'body\[data-theme="light"\]' psychology-academy/app/src/main/assets/final-v4.css
          grep -q 'body\[data-theme="light"\]' psychology-academy/app/src/main/assets/brand-v5.css
          grep -q 'brand-v5.svg' psychology-academy/app/src/main/assets/brand-v5.js
          grep -q 'brand-v5.js' psychology-academy/app/src/main/assets/index.html
          grep -q 'brand-v5.css' psychology-academy/app/src/main/assets/index.html
          grep -q 'graduation' /dev/null || true
          grep -q '<path d="M157 126' psychology-academy/app/src/main/assets/brand-v5.svg
          grep -q 'android:icon="@drawable/psychology_icon"' psychology-academy/app/src/main/AndroidManifest.xml
          ! grep -q 'teaching-v3.js' psychology-academy/app/src/main/assets/index.html
          ! grep -q 'تخيل أنني' psychology-academy/app/src/main/assets/final-v4.js
          grep -q 'أساسيات الصحة النفسية' psychology-academy/app/src/main/assets/data.js
          grep -q 'علم نفس اللغة والفصاحة' psychology-academy/app/src/main/assets/data.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and SVG renderer
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
      - name: Generate Android launcher icon
        run: |
          mkdir -p psychology-academy/app/src/main/res/drawable
          rsvg-convert -w 512 -h 512 psychology-academy/app/src/main/assets/brand-v5.svg -o psychology-academy/app/src/main/res/drawable/psychology_icon.png
          file psychology-academy/app/src/main/res/drawable/psychology_icon.png | grep -q 'PNG image data, 512 x 512'
          test $(stat -c%s psychology-academy/app/src/main/res/drawable/psychology_icon.png) -gt 10000
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: psychology-academy
        run: gradle --no-daemon assembleDebug
      - name: Verify APK contents and launcher icon
        run: |
          APK=psychology-academy/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/index.html'
          unzip -l "$APK" | grep -q 'assets/data.js'
          unzip -l "$APK" | grep -q 'assets/brand-v5.svg'
          unzip -l "$APK" | grep -q 'assets/brand-v5.js'
          unzip -l "$APK" | grep -q 'assets/brand-v5.css'
          unzip -l "$APK" | grep -q 'assets/final-v4.js'
          unzip -l "$APK" | grep -q 'classes.dex'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q 'application-icon'
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep -q 'أكاديمية علم النفس'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PsychologyAcademy-v5-BrandFinal
          path: psychology-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
