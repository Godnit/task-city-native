name: Build Hand Gesture Cube Native APK

on:
  push:
    branches: [main, agent/hand-cube-smooth-grab-v16, agent/hand-cube-low-latency-v17, agent/hand-cube-lite-realtime-v18]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build offline Lite hand model bundle
        run: |
          model_root="$RUNNER_TEMP/hand-landmarker-lite"
          mkdir -p app/src/main/assets "$model_root"
          curl -L --fail --retry 3 \
            -o "$model_root/hand_detector.tflite" \
            https://storage.googleapis.com/mediapipe-assets/palm_detection_lite.tflite
          curl -L --fail --retry 3 \
            -o "$model_root/hand_landmarks_detector.tflite" \
            https://storage.googleapis.com/mediapipe-assets/hand_landmark_lite.tflite
          (cd "$model_root" && zip -q -0 \
            "$GITHUB_WORKSPACE/app/src/main/assets/hand_landmarker.task" \
            hand_detector.tflite hand_landmarks_detector.tflite)
          unzip -l app/src/main/assets/hand_landmarker.task
          if strings "$model_root/hand_detector.tflite" | grep -q 'palmdetector_full'; then
            echo 'Full palm model was included instead of Lite'
            exit 1
          fi
          if strings "$model_root/hand_landmarks_detector.tflite" | grep -q 'handskeleton_handflag_handedness_full'; then
            echo 'Full landmark model was included instead of Lite'
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Reject Android 9-only native imports
        run: |
          inspect_root="$RUNNER_TEMP/hand-gesture-native-inspect"
          mkdir -p "$inspect_root"
          unzip -q app/build/outputs/apk/release/app-release.apk 'lib/*/*.so' -d "$inspect_root"
          while IFS= read -r -d '' so_file; do
            if readelf -Ws "$so_file" | grep -Eq 'UND.*aligned_alloc(@|$)'; then
              echo "Android 9-only aligned_alloc import found in $so_file"
              exit 1
            fi
          done < <(find "$inspect_root" -type f -name '*.so' -print0)

      - name: Run native inference on Android 8.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated
          disable-animations: true
          script: bash scripts/android8_self_test.sh

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/release/app-release.apk

      - name: Verify signature and Android 8 compatibility
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'assets/hand_landmarker.task'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/armeabi-v7a/'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/x86/'

      - name: Create lightweight 32-bit delivery APK
        run: |
          light_work="$RUNNER_TEMP/hand-gesture-v1.8-light-work.apk"
          light_aligned="$RUNNER_TEMP/hand-gesture-v1.8-light-aligned.apk"
          release_keystore="$RUNNER_TEMP/hand-gesture-v1.8.keystore"
          cp app/build/outputs/apk/release/app-release.apk "$light_work"
          zip -q -d "$light_work" 'lib/x86/*'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$light_work" "$light_aligned"
          keytool -genkeypair -noprompt \
            -keystore "$release_keystore" \
            -storepass android \
            -keypass android \
            -alias handgesture \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Hand Gesture Cube, OU=Android, O=Godnit, L=Sanaa, C=YE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$release_keystore" \
            --ks-key-alias handgesture \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            "$light_aligned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'lib/x86/'; then
            echo 'x86 files remained in lightweight APK'
            exit 1
          fi

      - name: Verify Lite models in delivery APK
        run: |
          model_check="$RUNNER_TEMP/delivery-lite-models"
          mkdir -p "$model_check"
          unzip -p app/build/outputs/apk/release/app-release.apk assets/hand_landmarker.task > "$model_check/hand_landmarker.task"
          unzip -q "$model_check/hand_landmarker.task" -d "$model_check/models"
          if strings "$model_check/models/hand_detector.tflite" | grep -q 'palmdetector_full'; then
            echo 'Delivery APK contains the full palm model'
            exit 1
          fi
          if strings "$model_check/models/hand_landmarks_detector.tflite" | grep -q 'handskeleton_handflag_handedness_full'; then
            echo 'Delivery APK contains the full landmark model'
            exit 1
          fi
          echo 'Verified Lite palm and landmark models in delivery APK'

      - name: Prepare named APK
        run: cp app/build/outputs/apk/release/app-release.apk Hand-Gesture-Cube-v1.8-Lite-Realtime.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hand-Gesture-Cube-v1.8-Lite-Realtime
          path: Hand-Gesture-Cube-v1.8-Lite-Realtime.apk
          if-no-files-found: error
          retention-days: 30
