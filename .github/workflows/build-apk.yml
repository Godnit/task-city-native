name: Build Hand Gesture Cube Native APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add offline native hand model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/release/app-release.apk

      - name: Verify signature and native libraries
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'assets/hand_landmarker.task'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/armeabi-v7a/'

      - name: Prepare named APK
        run: cp app/build/outputs/apk/release/app-release.apk Hand-Gesture-Cube-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hand-Gesture-Cube-v1.1
          path: Hand-Gesture-Cube-v1.1.apk
          if-no-files-found: error
          retention-days: 30
