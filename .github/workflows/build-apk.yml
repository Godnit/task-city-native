name: Build Task City Lightweight APK

on:
  push:
    branches: [task-city-real-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build lightweight release APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
          BYTES="$(stat -c%s "$APK")"
          echo "APK bytes: $BYTES"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          test "$BYTES" -le 20971520
          cp "$APK" Task-City-v1.2.1-Light.apk

      - name: Upload lightweight APK
        uses: actions/upload-artifact@v4
        with:
          name: Task-City-v1.2.1-Light
          path: Task-City-v1.2.1-Light.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
