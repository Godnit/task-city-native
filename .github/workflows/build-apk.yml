name: Build Hand Gesture Cube Native APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add offline native hand model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Patch MediaPipe safely for Android 8.1
        run: |
          patch_root="$RUNNER_TEMP/hand-gesture-apk-patch"
          unsigned_apk="$RUNNER_TEMP/hand-gesture-v1.4-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/hand-gesture-v1.4-aligned.apk"
          release_keystore="$RUNNER_TEMP/hand-gesture-v1.4.keystore"
          mkdir -p "$patch_root"
          unzip -q app/build/outputs/apk/release/app-release.apk -x 'META-INF/*' -d "$patch_root"
          python3 scripts/patch_android8_compat.py "$patch_root"/lib/*/libmediapipe_tasks_jni.so
          (cd "$patch_root" && zip -q -r "$unsigned_apk" .)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          keytool -genkeypair -noprompt \
            -keystore "$release_keystore" \
            -storepass android \
            -keypass android \
            -alias handgesture \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Hand Gesture Cube, OU=Android, O=Godnit, L=Sanaa, C=YE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$release_keystore" \
            --ks-key-alias handgesture \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            "$aligned_apk"

      - name: Run native inference on Android 8.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated
          disable-animations: true
          script: bash scripts/android8_self_test.sh

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/release/app-release.apk

      - name: Verify signature and Android 8 compatibility
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'assets/hand_landmarker.task'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/armeabi-v7a/'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/x86/'
          verify_root="$RUNNER_TEMP/hand-gesture-apk-verify"
          mkdir -p "$verify_root"
          unzip -q app/build/outputs/apk/release/app-release.apk 'lib/*/libmediapipe_tasks_jni.so' -d "$verify_root"
          python3 scripts/patch_android8_compat.py --check "$verify_root"/lib/*/libmediapipe_tasks_jni.so

      - name: Create lightweight 32-bit delivery APK
        run: |
          light_work="$RUNNER_TEMP/hand-gesture-v1.4-light-work.apk"
          light_aligned="$RUNNER_TEMP/hand-gesture-v1.4-light-aligned.apk"
          cp app/build/outputs/apk/release/app-release.apk "$light_work"
          zip -q -d "$light_work" 'lib/x86/*'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$light_work" "$light_aligned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/hand-gesture-v1.4.keystore" \
            --ks-key-alias handgesture \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            "$light_aligned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'lib/x86/'; then
            echo 'x86 files remained in lightweight APK'
            exit 1
          fi

      - name: Prepare named APK
        run: cp app/build/outputs/apk/release/app-release.apk Hand-Gesture-Cube-v1.4-Light.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hand-Gesture-Cube-v1.4-Light
          path: Hand-Gesture-Cube-v1.4-Light.apk
          if-no-files-found: error
          retention-days: 30
