name: Build Restored V1.3 Fast Hand Tracker APK

on:
  push:
    branches: [agent/hand-cube-v13-restored-fast]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Add official offline hand task
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          test -s app/src/main/assets/hand_landmarker.task
          unzip -t app/src/main/assets/hand_landmarker.task

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle --no-daemon assembleRelease

      - name: Keep full APK for x86 emulator
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/v13-full.apk"

      - name: Reject Android 9-only native imports
        run: |
          inspect_root="$RUNNER_TEMP/v13-native-inspect"
          mkdir -p "$inspect_root"
          unzip -q app/build/outputs/apk/release/app-release.apk 'lib/*/*.so' -d "$inspect_root"
          while IFS= read -r -d '' so_file; do
            if readelf -Ws "$so_file" | grep -Eq 'UND.*aligned_alloc(@|$)'; then
              echo "Android 9-only aligned_alloc import found in $so_file"
              exit 1
            fi
          done < <(find "$inspect_root" -type f -name '*.so' -print0)

      - name: Verify full APK
        run: |
          unzip -t app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'assets/hand_landmarker.task'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/armeabi-v7a/'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/x86/'

      - name: Create lightweight 32-bit delivery APK
        run: |
          light_work="$RUNNER_TEMP/v13-fast-light-work.apk"
          light_aligned="$RUNNER_TEMP/v13-fast-light-aligned.apk"
          release_keystore="$RUNNER_TEMP/v13-fast.keystore"
          cp app/build/outputs/apk/release/app-release.apk "$light_work"
          zip -q -d "$light_work" 'lib/x86/*'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$light_work" "$light_aligned"
          keytool -genkeypair -noprompt \
            -keystore "$release_keystore" \
            -storepass android \
            -keypass android \
            -alias handgesture \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Hand Gesture Cube, OU=Android, O=Godnit, L=Sanaa, C=YE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$release_keystore" \
            --ks-key-alias handgesture \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release.apk \
            "$light_aligned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk
          if unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'lib/x86/'; then
            echo 'x86 files remained in delivery APK'
            exit 1
          fi

      - name: Prepare named APK
        run: cp app/build/outputs/apk/release/app-release.apk Hand-Gesture-Cube-v1.3-Restored-Fast.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hand-Gesture-Cube-v1.3-Restored-Fast
          path: Hand-Gesture-Cube-v1.3-Restored-Fast.apk
          if-no-files-found: error
          retention-days: 30

      - name: Process real camera frames on Android 8.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated
          disable-animations: true
          script: bash scripts/android8_v13_camera_test.sh
