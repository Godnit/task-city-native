name: Build Task City Godot APK

on:
  push:
    branches: [task-city-real-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION=4.4.1
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Configure Godot Android paths and debug signing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$HOME/.android/debug.keystore"

      - name: Import project and validate GDScript
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path godot --quit 2>&1 | tee /tmp/godot-import.log
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' /tmp/godot-import.log; then
            cat /tmp/godot-import.log
            exit 1
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --verbose --path godot --export-debug "Android" "$GITHUB_WORKSPACE/Task-City-v1.2.0-Godot.apk" 2>&1 | tee /tmp/godot-export.log
          test -s Task-City-v1.2.0-Godot.apk
          unzip -t Task-City-v1.2.0-Godot.apk

      - name: Smoke test on Android 8.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86_64
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r Task-City-v1.2.0-Godot.apk
            adb shell monkey -p com.godnit.taskcity -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.godnit.taskcity
            adb logcat -d -t 500 > /tmp/taskcity-logcat.txt
            if grep -q 'FATAL EXCEPTION' /tmp/taskcity-logcat.txt && grep -q 'com.godnit.taskcity' /tmp/taskcity-logcat.txt; then cat /tmp/taskcity-logcat.txt; exit 1; fi

      - name: Upload Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: Task-City-v1.2.0-Godot
          path: Task-City-v1.2.0-Godot.apk
          if-no-files-found: error
          retention-days: 30
