name: Build Task City APK

on:
  push:
    branches: [main, task-city-real-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - name: Smoke test on Android 8.1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86_64
          profile: Nexus 5X
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.godnit.taskcity/.MainActivity
            sleep 4
            adb shell dumpsys activity activities | grep -q 'com.godnit.taskcity/.MainActivity'
            if adb logcat -d -t 300 | grep -E 'FATAL EXCEPTION: main|Process: com.godnit.taskcity' | grep -q 'AndroidRuntime'; then
              echo 'Task City crashed on Android 8.1'
              adb logcat -d -t 300
              exit 1
            fi

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Task-City-v1.0.0-Android8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Task-City-v1.0.0-Android8
          path: Task-City-v1.0.0-Android8.apk
          if-no-files-found: error
          retention-days: 30
