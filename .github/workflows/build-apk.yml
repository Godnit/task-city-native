name: Build Task City Compact APK

on:
  push:
    branches: [task-city-real-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_VERSION=4.4.1
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --version

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n 1)"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Configure Godot Android release signing
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/taskcity-release.keystore" -storepass taskcity123 -alias taskcity -keypass taskcity123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Task City,O=Godnit,C=YE"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project and validate GDScript
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path godot --quit 2>&1 | tee /tmp/godot-import.log
          if grep -qE 'SCRIPT ERROR: Parse Error|Failed to load script.*Parse error' /tmp/godot-import.log; then
            cat /tmp/godot-import.log
            exit 1
          fi

      - name: Export compact release APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/taskcity-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: taskcity
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: taskcity123
        run: |
          set -euxo pipefail
          godot --headless --path godot --export-release "Android" "$GITHUB_WORKSPACE/Task-City-v1.2.1-Compact.apk" 2>&1 | tee /tmp/godot-export.log
          test -s Task-City-v1.2.1-Compact.apk
          unzip -t Task-City-v1.2.1-Compact.apk
          echo "APK size: $(du -h Task-City-v1.2.1-Compact.apk | cut -f1)"
          test "$(stat -c%s Task-City-v1.2.1-Compact.apk)" -le 20971520
          unzip -l Task-City-v1.2.1-Compact.apk | grep 'lib/armeabi-v7a/libgodot_android.so'
          ! unzip -l Task-City-v1.2.1-Compact.apk | grep -q 'lib/arm64-v8a/'
          ! unzip -l Task-City-v1.2.1-Compact.apk | grep -q 'lib/x86_64/'

      - name: Upload compact APK
        uses: actions/upload-artifact@v4
        with:
          name: Task-City-v1.2.1-Compact
          path: Task-City-v1.2.1-Compact.apk
          if-no-files-found: error
          retention-days: 30
