name: Build Task City v2 APK

on:
  push:
    branches: [ agent/task-city-environment-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify and name APK
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/task-city-v2.0.apk
          sha256sum dist/task-city-v2.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-city-v2.0-apk
          path: dist/task-city-v2.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified preview APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/task-city-v2.0.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish Task City v2 APK [skip ci]"
          git push origin HEAD:agent/task-city-environment-v2
