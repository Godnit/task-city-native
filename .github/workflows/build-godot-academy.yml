name: Build Godot Academy APK
on:
  push:
    branches: [ godot-academy-v1 ]
    paths:
      - 'godot-academy/**'
      - '.github/workflows/build-godot-academy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and UI wiring
        run: |
          node --check godot-academy/app/src/main/assets/app.js
          node --check godot-academy/app/src/main/assets/data.js
          node --check godot-academy/app/src/main/assets/godot-ui-v2.js
          node --check godot-academy/app/src/main/assets/godot-fixes-v3.js
          grep -q 'godot-fixes-v3.css' godot-academy/app/src/main/assets/index.html
          grep -q 'godot-fixes-v3.js' godot-academy/app/src/main/assets/index.html
          grep -q 'function setAcademyFilterV3' godot-academy/app/src/main/assets/godot-fixes-v3.js
          grep -q "\['all','الكل'\]" godot-academy/app/src/main/assets/godot-fixes-v3.js
          grep -q 'data-tab="script"' godot-academy/app/src/main/assets/godot-fixes-v3.js
          grep -q 'toggleAcademySearchV3' godot-academy/app/src/main/assets/godot-fixes-v3.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: godot-academy
        run: gradle --no-daemon assembleDebug
      - name: Verify APK contents
        run: |
          unzip -l godot-academy/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/godot-fixes-v3.js'
          unzip -l godot-academy/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/godot-fixes-v3.css'
          unzip -l godot-academy/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/app.js'
          unzip -l godot-academy/app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodotAcademy-APK
          path: godot-academy/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
