name: Build Godot Academy APK
on:
  push:
    branches: [ godot-academy-v1 ]
    paths:
      - 'godot-academy/**'
      - '.github/workflows/build-godot-academy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose icon chunks
        run: |
          wc -c godot-academy/icon_parts_v5/part01a.txt godot-academy/icon_parts_v5/part01b.txt godot-academy/icon_parts_v5/part01c.txt godot-academy/icon_parts_v5/part01d.txt godot-academy/icon_parts_v5/part01e.txt godot-academy/icon_parts_v5/part02.txt godot-academy/icon_parts_v5/part03.txt godot-academy/icon_parts_v5/part04.txt godot-academy/icon_parts_v5/part05.txt godot-academy/icon_parts_v5/part06.txt godot-academy/icon_parts_v5/part07a.txt godot-academy/icon_parts_v5/part07b.txt
          sha256sum godot-academy/icon_parts_v5/part01a.txt godot-academy/icon_parts_v5/part01b.txt godot-academy/icon_parts_v5/part01c.txt godot-academy/icon_parts_v5/part01d.txt godot-academy/icon_parts_v5/part01e.txt godot-academy/icon_parts_v5/part02.txt godot-academy/icon_parts_v5/part03.txt godot-academy/icon_parts_v5/part04.txt godot-academy/icon_parts_v5/part05.txt godot-academy/icon_parts_v5/part06.txt godot-academy/icon_parts_v5/part07a.txt godot-academy/icon_parts_v5/part07b.txt
          cat godot-academy/icon_parts_v5/part01a.txt godot-academy/icon_parts_v5/part01b.txt godot-academy/icon_parts_v5/part01c.txt godot-academy/icon_parts_v5/part01d.txt godot-academy/icon_parts_v5/part01e.txt godot-academy/icon_parts_v5/part02.txt godot-academy/icon_parts_v5/part03.txt godot-academy/icon_parts_v5/part04.txt godot-academy/icon_parts_v5/part05.txt godot-academy/icon_parts_v5/part06.txt godot-academy/icon_parts_v5/part07a.txt godot-academy/icon_parts_v5/part07b.txt > /tmp/all.b64
          echo TOTAL
          wc -c /tmp/all.b64
          sha256sum /tmp/all.b64
