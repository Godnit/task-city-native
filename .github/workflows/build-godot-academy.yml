name: Build Godot Academy v6 Visual APK
on:
  push:
    branches: [ godot-academy-visual-v6 ]
    paths:
      - 'godot-academy/**'
      - '.github/workflows/build-godot-academy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare exact selected launcher icon
        run: |
          cat \
            godot-academy/icon_parts_v5/part01a1.txt \
            godot-academy/icon_parts_v5/part01a2.txt \
            godot-academy/icon_parts_v5/part01b.txt \
            godot-academy/icon_parts_v5/part01c.txt \
            godot-academy/icon_parts_v5/part01d.txt \
            godot-academy/icon_parts_v5/part01e.txt \
            godot-academy/icon_parts_v5/part02.txt \
            godot-academy/icon_parts_v5/part03.txt \
            godot-academy/icon_parts_v5/part04.txt \
            godot-academy/icon_parts_v5/part05.txt \
            godot-academy/icon_parts_v5/part06.txt \
            godot-academy/icon_parts_v5/part07a.txt \
            godot-academy/icon_parts_v5/part07b.txt > /tmp/godot_icon.b64
          test "$(wc -c < /tmp/godot_icon.b64)" -eq 12356
          echo "5611bd74ec73f5ef966259b20c995dd1f1f2768f1889a32fd373ffd911255210  /tmp/godot_icon.b64" | sha256sum -c -
          base64 -d /tmp/godot_icon.b64 > godot-academy/app/src/main/res/drawable/ic_launcher_v5.jpg
          test "$(wc -c < godot-academy/app/src/main/res/drawable/ic_launcher_v5.jpg)" -eq 9266
          echo "0082d45c39384e0f31e9fe501d7a0519e10d0221f8fb0e970f66b8541e90bd2c  godot-academy/app/src/main/res/drawable/ic_launcher_v5.jpg" | sha256sum -c -
          cp godot-academy/app/src/main/res/drawable/ic_launcher_v5.jpg godot-academy/app/src/main/assets/godot_academy_icon_v5.jpg
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "godot-academy/app/src/main/res/mipmap-${density}"
            cp godot-academy/app/src/main/res/drawable/ic_launcher_v5.jpg "godot-academy/app/src/main/res/mipmap-${density}/ic_launcher.jpg"
            cp godot-academy/app/src/main/res/drawable/ic_launcher_v5.jpg "godot-academy/app/src/main/res/mipmap-${density}/ic_launcher_round.jpg"
          done

      - name: Validate curriculum and visual code
        run: |
          node --check godot-academy/app/src/main/assets/app.js
          node --check godot-academy/app/src/main/assets/data.js
          node --check godot-academy/app/src/main/assets/godot-ui-v2.js
          node --check godot-academy/app/src/main/assets/godot-fixes-v3.js
          node --check godot-academy/app/src/main/assets/godot-curriculum-v4.js
          node --check godot-academy/app/src/main/assets/godot-data-hotfix-v6.js
          node --check godot-academy/app/src/main/assets/godot-core-v4b.js
          node --check godot-academy/app/src/main/assets/godot-labs-v4-hotfix.js
          node --check godot-academy/app/src/main/assets/godot-polish-v5.js
          node --check godot-academy/app/src/main/assets/godot-visual-v6.js
          node --check godot-academy/visual-smoke-v6.cjs
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{},console}; ctx.window=ctx;
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('godot-academy/app/src/main/assets/data.js','utf8'),ctx);
          ctx.DATA=ctx.GODOT_DATA;
          vm.runInContext(fs.readFileSync('godot-academy/app/src/main/assets/godot-curriculum-v4.js','utf8'),ctx);
          vm.runInContext(fs.readFileSync('godot-academy/app/src/main/assets/godot-data-hotfix-v6.js','utf8'),ctx);
          if(ctx.DATA.stages.length!==8) throw new Error('Expected 8 stages');
          if(ctx.DATA.lessons.length!==97) throw new Error('Expected 97 lessons');
          for(let s=1;s<=8;s++) if(ctx.DATA.lessons.filter(l=>l.stageId===s).length<12) throw new Error('Missing lessons stage '+s);
          for(let s=2;s<=8;s++) if(!ctx.GODOT_EXAMS_V4[s]||ctx.GODOT_EXAMS_V4[s].length!==5) throw new Error('Missing exam stage '+s);
          for(let s=2;s<=8;s++) if(!ctx.GODOT_PROJECTS_V4[s]) throw new Error('Missing project stage '+s);
          const invalid=ctx.DATA.lessons.map((l,i)=>({i,title:l.title,opts:l.opts,ans:l.ans,q:l.q})).filter(x=>!Array.isArray(x.opts)||typeof x.ans!=='number'||typeof x.q!=='string');
          if(invalid.length) throw new Error('Malformed lessons: '+JSON.stringify(invalid));
          console.log('Curriculum OK: 8 stages / 97 lessons / quiz shapes valid');
          NODE
          grep -q 'godot-polish-v5.css' godot-academy/app/src/main/assets/index.html
          grep -q 'godot-polish-v5.js' godot-academy/app/src/main/assets/index.html
          grep -q 'godot-data-hotfix-v6.js' godot-academy/app/src/main/assets/index.html
          grep -q 'godot-visual-v6.css' godot-academy/app/src/main/assets/index.html
          grep -q 'godot-visual-v6.js' godot-academy/app/src/main/assets/index.html
          grep -q '@mipmap/ic_launcher' godot-academy/app/src/main/AndroidManifest.xml
          grep -q '@mipmap/ic_launcher_round' godot-academy/app/src/main/AndroidManifest.xml
          test -f godot-academy/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f godot-academy/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q "versionCode 7" godot-academy/app/build.gradle
          grep -q "versionName '6.0'" godot-academy/app/build.gradle

      - name: Visual overflow test on phone widths
        run: |
          npm install --no-save puppeteer-core@24.16.0
          CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME_BIN"
          export CHROME_BIN
          python3 -m http.server 8123 --bind 127.0.0.1 --directory godot-academy/app/src/main/assets >/tmp/godot-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node godot-academy/visual-smoke-v6.cjs

      - name: Upload visual verification shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GodotAcademy-v6-Visual-Checks
          path: /tmp/godot-v6-visual/*.png
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: godot-academy
        run: gradle --no-daemon assembleDebug

      - name: Verify APK contents and launcher icon
        run: |
          APK=godot-academy/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'assets/godot-polish-v5.js'
          unzip -l "$APK" | grep -q 'assets/godot-data-hotfix-v6.js'
          unzip -l "$APK" | grep -q 'assets/godot-visual-v6.css'
          unzip -l "$APK" | grep -q 'assets/godot-visual-v6.js'
          unzip -l "$APK" | grep -q 'assets/godot_academy_icon_v5.jpg'
          ICON_PATH=$(unzip -Z1 "$APK" | grep -E '^res/mipmap-xxxhdpi[^/]*/ic_launcher\.jpg$' | head -1)
          test -n "$ICON_PATH"
          unzip -p "$APK" "$ICON_PATH" > /tmp/apk_icon.jpg
          test "$(wc -c < /tmp/apk_icon.jpg)" -eq 9266
          echo "0082d45c39384e0f31e9fe501d7a0519e10d0221f8fb0e970f66b8541e90bd2c  /tmp/apk_icon.jpg" | sha256sum -c -
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "application: label='أكاديمية Godot'" /tmp/badging.txt
          grep -q 'application-icon-' /tmp/badging.txt
          cp "$APK" Godot_Academy_v6_Visual.apk
          sha256sum Godot_Academy_v6_Visual.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodotAcademy-v6-VisualOverhaul
          path: Godot_Academy_v6_Visual.apk
          if-no-files-found: error
          retention-days: 7
