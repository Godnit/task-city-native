name: Build Network Academy Final Icon 7

on:
  push:
    branches: [network-academy-final-icon7]
    paths:
      - 'network-fix/**'
      - '.github/workflows/network-academy-install-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download Apktool
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request(
              'https://api.github.com/repos/iBotPeaches/Apktool/releases/latest',
              headers={'User-Agent':'network-academy-build'}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              release=json.load(r)
          jars=[a for a in release.get('assets',[]) if a['name'].startswith('apktool_') and a['name'].endswith('.jar')]
          assert jars, 'No Apktool jar asset found'
          asset=jars[0]
          urllib.request.urlretrieve(asset['browser_download_url'],'/tmp/apktool.jar')
          print('Downloaded',release['tag_name'],asset['name'])
          PY
          java -jar /tmp/apktool.jar --version

      - name: Reconstruct base APK
        run: |
          cat \
            network-fix/chunk_00.b64 \
            network-fix/chunk_01.b64 \
            network-fix/chunk_02.b64 \
            network-fix/chunk_03.b64 \
            network-fix/chunk_04a.b64 \
            network-fix/chunk_04b.b64 \
            network-fix/chunk_05.b64 \
            network-fix/chunk_06.b64 \
            network-fix/chunk_07.b64 \
            network-fix/chunk_08.b64 > /tmp/app.b64
          test "$(wc -c < /tmp/app.b64)" -eq 97800
          base64 -d /tmp/app.b64 > /tmp/app-base.apk
          unzip -t /tmp/app-base.apk

      - name: Keep all v5 fixes and apply final package
        run: |
          python3 - <<'PY'
          import zipfile, os
          src='/tmp/app-base.apk'; dst='/tmp/app-v5.apk'
          old_activity='com.godnit.networkacadfix.MainActivity'.encode('utf-16le')
          real_activity='com.godnit.networkacademy.MainActivity'.encode('utf-16le')
          old_pkg='com.godnit.networkacadfix'.encode('utf-16le')
          new_pkg='com.godnit.networkacadfi7'.encode('utf-16le')
          assert len(old_activity)==len(real_activity)
          assert len(old_pkg)==len(new_pkg)
          css=open('network-fix/v5-fix.css','rb').read()
          js=open('network-fix/v5-fix.js','rb').read()
          brand=open('network-fix/icon7/brand-icon.svg','rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w') as zout:
              for info in zin.infolist():
                  if info.filename.startswith('META-INF/'):
                      continue
                  data=zin.read(info.filename)
                  if info.filename=='AndroidManifest.xml':
                      assert data.count(old_activity)==1
                      data=data.replace(old_activity,real_activity)
                      assert data.count(old_pkg)==1
                      data=data.replace(old_pkg,new_pkg)
                  elif info.filename=='assets/index.html':
                      text=data.decode('utf-8')
                      text=text.replace('</head>','  <link rel="stylesheet" href="v5-fix.css" />\n</head>')
                      text=text.replace('</body>','  <script src="v5-fix.js"></script>\n</body>')
                      data=text.encode('utf-8')
                  elif info.filename=='assets/brand-icon.svg':
                      data=brand
                  zout.writestr(info,data)
              zout.writestr('assets/v5-fix.css',css,compress_type=zipfile.ZIP_DEFLATED)
              zout.writestr('assets/v5-fix.js',js,compress_type=zipfile.ZIP_DEFLATED)
          with zipfile.ZipFile(dst,'r') as z:
              m=z.read('AndroidManifest.xml')
              assert m.count(new_pkg)==1
              assert m.count(real_activity)==1
              html=z.read('assets/index.html')
              assert b'v5-fix.css' in html and b'v5-fix.js' in html
              assert z.read('assets/brand-icon.svg')==brand
              assert b'Lcom/godnit/networkacademy/MainActivity;' in z.read('classes2.dex')
          print('v5 UI fixes, final package and icon 7 brand verified:',os.path.getsize(dst))
          PY
          unzip -t /tmp/app-v5.apk

      - name: Replace Android launcher with icon 7
        run: |
          java -jar /tmp/apktool.jar d -s -f /tmp/app-v5.apk -o /tmp/decoded
          test -f /tmp/decoded/res/drawable/ic_launcher.xml
          cp network-fix/icon7/ic_launcher.xml /tmp/decoded/res/drawable/ic_launcher.xml
          cp network-fix/icon7/brand-icon.svg /tmp/decoded/assets/brand-icon.svg
          grep -q 'M20,31L54,17L88,31L54,45Z' /tmp/decoded/res/drawable/ic_launcher.xml
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/app-final-unsigned.apk
          unzip -t /tmp/app-final-unsigned.apk

      - name: Align APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 /tmp/app-final-unsigned.apk /tmp/app-aligned.apk
          "$ZIPALIGN" -c -v 4 /tmp/app-aligned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/network-final.keystore \
            -storepass android \
            -keypass android \
            -alias networkfinal \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Network Academy Final,O=Godnit,C=US"

      - name: Sign and verify final APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$APKSIGNER" sign \
            --ks /tmp/network-final.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Network_Academy_FINAL_Icon7.apk \
            /tmp/app-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs Network_Academy_FINAL_Icon7.apk
          "$ZIPALIGN" -c -v 4 Network_Academy_FINAL_Icon7.apk
          unzip -t Network_Academy_FINAL_Icon7.apk
          file Network_Academy_FINAL_Icon7.apk
          sha256sum Network_Academy_FINAL_Icon7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Network-Academy-FINAL-Icon7
          path: Network_Academy_FINAL_Icon7.apk
          if-no-files-found: error
          retention-days: 7
