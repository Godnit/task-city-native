name: Build Network Academy Beginner v9

on:
  push:
    branches: [network-academy-beginner-v9]
    paths:
      - 'network-fix/**'
      - '.github/workflows/network-academy-install-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate beginner learning and lab code
        run: |
          node --check network-fix/v6-guided.js
          node --check network-fix/v7-foundations.js
          node --check network-fix/v7-hotfix.js
          node --check network-fix/v8-polish.js
          node --check network-fix/v9-beginner.js
          grep -q 'كيف يجد الجهاز جهازًا آخر داخل نفس الشبكة' network-fix/v9-beginner.js
          grep -q 'لن نستخدم DNS أو HTTP هنا' network-fix/v9-beginner.js
          grep -q 'حذف رابطة' network-fix/v9-beginner.js
          grep -q 'الرجوع إلى الدرس' network-fix/v9-beginner.js
          grep -q 'cleanLabState' network-fix/v9-beginner.js
          grep -q 'body.light' network-fix/v9-beginner.css

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download Apktool
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/iBotPeaches/Apktool/releases/latest',headers={'User-Agent':'network-academy-build'})
          with urllib.request.urlopen(req, timeout=30) as r: release=json.load(r)
          jars=[a for a in release.get('assets',[]) if a['name'].startswith('apktool_') and a['name'].endswith('.jar')]
          assert jars
          urllib.request.urlretrieve(jars[0]['browser_download_url'],'/tmp/apktool.jar')
          PY
          java -jar /tmp/apktool.jar --version

      - name: Reconstruct base APK
        run: |
          cat \
            network-fix/chunk_00.b64 \
            network-fix/chunk_01.b64 \
            network-fix/chunk_02.b64 \
            network-fix/chunk_03.b64 \
            network-fix/chunk_04a.b64 \
            network-fix/chunk_04b.b64 \
            network-fix/chunk_05.b64 \
            network-fix/chunk_06.b64 \
            network-fix/chunk_07.b64 \
            network-fix/chunk_08.b64 > /tmp/app.b64
          test "$(wc -c < /tmp/app.b64)" -eq 97800
          base64 -d /tmp/app.b64 > /tmp/app-base.apk
          unzip -t /tmp/app-base.apk

      - name: Inject beginner progression, lab fixes, visuals, and icon 7
        run: |
          python3 - <<'PY'
          import zipfile, os
          src='/tmp/app-base.apk'; dst='/tmp/app-v9.apk'
          old_activity='com.godnit.networkacadfix.MainActivity'.encode('utf-16le')
          real_activity='com.godnit.networkacademy.MainActivity'.encode('utf-16le')
          old_pkg='com.godnit.networkacadfix'.encode('utf-16le')
          new_pkg='com.godnit.networkacadv09'.encode('utf-16le')
          assert len(old_activity)==len(real_activity)
          assert len(old_pkg)==len(new_pkg)
          names=['v5-fix.css','v5-fix.js','v6-guided.css','v6-guided.js','v7-foundations.css','v7-foundations.js','v7-hotfix.js','v8-polish.css','v8-polish.js','v9-beginner.css','v9-beginner.js']
          files={n:open('network-fix/'+n,'rb').read() for n in names}
          brand=open('network-fix/icon7/brand-icon.svg','rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w') as zout:
              for info in zin.infolist():
                  if info.filename.startswith('META-INF/'): continue
                  data=zin.read(info.filename)
                  if info.filename=='AndroidManifest.xml':
                      assert data.count(old_activity)==1
                      data=data.replace(old_activity,real_activity)
                      assert data.count(old_pkg)==1
                      data=data.replace(old_pkg,new_pkg)
                  elif info.filename=='assets/index.html':
                      text=data.decode('utf-8')
                      text=text.replace('</head>','  <link rel="stylesheet" href="v5-fix.css" />\n  <link rel="stylesheet" href="v6-guided.css" />\n  <link rel="stylesheet" href="v7-foundations.css" />\n  <link rel="stylesheet" href="v8-polish.css" />\n  <link rel="stylesheet" href="v9-beginner.css" />\n</head>')
                      text=text.replace('</body>','  <script src="v5-fix.js"></script>\n  <script src="v6-guided.js"></script>\n  <script src="v7-foundations.js"></script>\n  <script src="v7-hotfix.js"></script>\n  <script src="v8-polish.js"></script>\n  <script src="v9-beginner.js"></script>\n</body>')
                      data=text.encode('utf-8')
                  elif info.filename=='assets/brand-icon.svg': data=brand
                  zout.writestr(info,data)
              for name,data in files.items(): zout.writestr('assets/'+name,data,compress_type=zipfile.ZIP_DEFLATED)
          with zipfile.ZipFile(dst,'r') as z:
              m=z.read('AndroidManifest.xml'); html=z.read('assets/index.html')
              assert m.count(new_pkg)==1 and m.count(real_activity)==1
              for name in files: assert name.encode() in html
              assert html.index(b'v8-polish.js') < html.index(b'v9-beginner.js')
              v9=z.read('assets/v9-beginner.js')
              assert 'حذف رابطة'.encode('utf-8') in v9
              assert 'الرجوع إلى الدرس'.encode('utf-8') in v9
              assert b'cleanLabState' in v9
              assert 'لن نستخدم DNS أو HTTP هنا'.encode('utf-8') in v9
              assert b'body.light' in z.read('assets/v9-beginner.css')
              assert z.read('assets/brand-icon.svg')==brand
              assert b'Lcom/godnit/networkacademy/MainActivity;' in z.read('classes2.dex')
          print('Beginner v9 package verified:',os.path.getsize(dst))
          PY
          unzip -t /tmp/app-v9.apk

      - name: Replace Android launcher with icon 7
        run: |
          java -jar /tmp/apktool.jar d -s -f /tmp/app-v9.apk -o /tmp/decoded
          cp network-fix/icon7/ic_launcher.xml /tmp/decoded/res/drawable/ic_launcher.xml
          cp network-fix/icon7/brand-icon.svg /tmp/decoded/assets/brand-icon.svg
          test -f /tmp/decoded/assets/v9-beginner.js
          test -f /tmp/decoded/assets/v9-beginner.css
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/app-final-unsigned.apk
          unzip -t /tmp/app-final-unsigned.apk

      - name: Align APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 /tmp/app-final-unsigned.apk /tmp/app-aligned.apk
          "$ZIPALIGN" -c -v 4 /tmp/app-aligned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore /tmp/network-v9.keystore -storepass android -keypass android -alias networkv9 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Network Academy Beginner v9,O=Godnit,C=US"

      - name: Sign and verify APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$APKSIGNER" sign --ks /tmp/network-v9.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out Network_Academy_Beginner_v9_Icon7.apk /tmp/app-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs Network_Academy_Beginner_v9_Icon7.apk
          "$ZIPALIGN" -c -v 4 Network_Academy_Beginner_v9_Icon7.apk
          unzip -t Network_Academy_Beginner_v9_Icon7.apk
          unzip -p Network_Academy_Beginner_v9_Icon7.apk assets/v9-beginner.js | grep -q 'حذف رابطة'
          unzip -p Network_Academy_Beginner_v9_Icon7.apk assets/v9-beginner.js | grep -q 'cleanLabState'
          unzip -p Network_Academy_Beginner_v9_Icon7.apk assets/v9-beginner.js | grep -q 'لن نستخدم DNS أو HTTP هنا'
          file Network_Academy_Beginner_v9_Icon7.apk
          sha256sum Network_Academy_Beginner_v9_Icon7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Network-Academy-Beginner-v9-Icon7
          path: Network_Academy_Beginner_v9_Icon7.apk
          if-no-files-found: error
          retention-days: 7
