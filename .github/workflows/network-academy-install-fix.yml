name: Build Network Academy Guided v6

on:
  push:
    branches: [network-academy-guided-v6]
    paths:
      - 'network-fix/**'
      - '.github/workflows/network-academy-install-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate guided learning JavaScript
        run: |
          node --check network-fix/v6-guided.js
          grep -q 'لماذا نفعلها' network-fix/v6-guided.js
          grep -q 'ماذا يحدث داخل الشبكة' network-fix/v6-guided.js
          grep -q 'كيف أعرف أن الخطوة نجحت' network-fix/v6-guided.js

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download Apktool
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/iBotPeaches/Apktool/releases/latest',headers={'User-Agent':'network-academy-build'})
          with urllib.request.urlopen(req, timeout=30) as r: release=json.load(r)
          jars=[a for a in release.get('assets',[]) if a['name'].startswith('apktool_') and a['name'].endswith('.jar')]
          assert jars
          urllib.request.urlretrieve(jars[0]['browser_download_url'],'/tmp/apktool.jar')
          PY
          java -jar /tmp/apktool.jar --version

      - name: Reconstruct base APK
        run: |
          cat \
            network-fix/chunk_00.b64 \
            network-fix/chunk_01.b64 \
            network-fix/chunk_02.b64 \
            network-fix/chunk_03.b64 \
            network-fix/chunk_04a.b64 \
            network-fix/chunk_04b.b64 \
            network-fix/chunk_05.b64 \
            network-fix/chunk_06.b64 \
            network-fix/chunk_07.b64 \
            network-fix/chunk_08.b64 > /tmp/app.b64
          test "$(wc -c < /tmp/app.b64)" -eq 97800
          base64 -d /tmp/app.b64 > /tmp/app-base.apk
          unzip -t /tmp/app-base.apk

      - name: Inject v5 visuals, v6 causal guides, and icon 7 brand
        run: |
          python3 - <<'PY'
          import zipfile, os
          src='/tmp/app-base.apk'; dst='/tmp/app-v6.apk'
          old_activity='com.godnit.networkacadfix.MainActivity'.encode('utf-16le')
          real_activity='com.godnit.networkacademy.MainActivity'.encode('utf-16le')
          old_pkg='com.godnit.networkacadfix'.encode('utf-16le')
          new_pkg='com.godnit.networkacadv06'.encode('utf-16le')
          assert len(old_activity)==len(real_activity)
          assert len(old_pkg)==len(new_pkg)
          css5=open('network-fix/v5-fix.css','rb').read(); js5=open('network-fix/v5-fix.js','rb').read()
          css6=open('network-fix/v6-guided.css','rb').read(); js6=open('network-fix/v6-guided.js','rb').read()
          brand=open('network-fix/icon7/brand-icon.svg','rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w') as zout:
              for info in zin.infolist():
                  if info.filename.startswith('META-INF/'): continue
                  data=zin.read(info.filename)
                  if info.filename=='AndroidManifest.xml':
                      assert data.count(old_activity)==1
                      data=data.replace(old_activity,real_activity)
                      assert data.count(old_pkg)==1
                      data=data.replace(old_pkg,new_pkg)
                  elif info.filename=='assets/index.html':
                      text=data.decode('utf-8')
                      text=text.replace('</head>','  <link rel="stylesheet" href="v5-fix.css" />\n  <link rel="stylesheet" href="v6-guided.css" />\n</head>')
                      text=text.replace('</body>','  <script src="v5-fix.js"></script>\n  <script src="v6-guided.js"></script>\n</body>')
                      data=text.encode('utf-8')
                  elif info.filename=='assets/brand-icon.svg': data=brand
                  zout.writestr(info,data)
              zout.writestr('assets/v5-fix.css',css5,compress_type=zipfile.ZIP_DEFLATED)
              zout.writestr('assets/v5-fix.js',js5,compress_type=zipfile.ZIP_DEFLATED)
              zout.writestr('assets/v6-guided.css',css6,compress_type=zipfile.ZIP_DEFLATED)
              zout.writestr('assets/v6-guided.js',js6,compress_type=zipfile.ZIP_DEFLATED)
          with zipfile.ZipFile(dst,'r') as z:
              m=z.read('AndroidManifest.xml'); html=z.read('assets/index.html')
              assert m.count(new_pkg)==1 and m.count(real_activity)==1
              for name in (b'v5-fix.css',b'v5-fix.js',b'v6-guided.css',b'v6-guided.js'): assert name in html
              assert 'لماذا نفعلها'.encode('utf-8') in z.read('assets/v6-guided.js')
              assert z.read('assets/brand-icon.svg')==brand
              assert b'Lcom/godnit/networkacademy/MainActivity;' in z.read('classes2.dex')
          print('Guided v6 package verified:',os.path.getsize(dst))
          PY
          unzip -t /tmp/app-v6.apk

      - name: Replace Android launcher with icon 7
        run: |
          java -jar /tmp/apktool.jar d -s -f /tmp/app-v6.apk -o /tmp/decoded
          cp network-fix/icon7/ic_launcher.xml /tmp/decoded/res/drawable/ic_launcher.xml
          cp network-fix/icon7/brand-icon.svg /tmp/decoded/assets/brand-icon.svg
          grep -q 'M20,31L54,17L88,31L54,45Z' /tmp/decoded/res/drawable/ic_launcher.xml
          test -f /tmp/decoded/assets/v6-guided.js
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/app-final-unsigned.apk
          unzip -t /tmp/app-final-unsigned.apk

      - name: Align APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 /tmp/app-final-unsigned.apk /tmp/app-aligned.apk
          "$ZIPALIGN" -c -v 4 /tmp/app-aligned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore /tmp/network-v6.keystore -storepass android -keypass android -alias networkv6 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Network Academy Guided v6,O=Godnit,C=US"

      - name: Sign and verify APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$APKSIGNER" sign --ks /tmp/network-v6.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out Network_Academy_Guided_v6_Icon7.apk /tmp/app-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs Network_Academy_Guided_v6_Icon7.apk
          "$ZIPALIGN" -c -v 4 Network_Academy_Guided_v6_Icon7.apk
          unzip -t Network_Academy_Guided_v6_Icon7.apk
          unzip -p Network_Academy_Guided_v6_Icon7.apk assets/v6-guided.js | grep -q 'كيف أعرف أن الخطوة نجحت'
          file Network_Academy_Guided_v6_Icon7.apk
          sha256sum Network_Academy_Guided_v6_Icon7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Network-Academy-Guided-v6-Icon7
          path: Network_Academy_Guided_v6_Icon7.apk
          if-no-files-found: error
          retention-days: 7
