name: Build Network Academy Exact Icon v10

on:
  push:
    branches: [network-academy-exact-icon-v10]
    paths:
      - 'network-fix/**'
      - '.github/workflows/network-academy-install-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate learning code and exact icon source
        run: |
          node --check network-fix/v6-guided.js
          node --check network-fix/v7-foundations.js
          node --check network-fix/v7-hotfix.js
          node --check network-fix/v8-polish.js
          node --check network-fix/v9-beginner.js
          grep -q 'حذف رابطة' network-fix/v9-beginner.js
          grep -q 'الرجوع إلى الدرس' network-fix/v9-beginner.js
          grep -q 'data:image/png;base64,' network-fix/icon7/brand-icon-exact.svg

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Download Apktool
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request('https://api.github.com/repos/iBotPeaches/Apktool/releases/latest',headers={'User-Agent':'network-academy-build'})
          with urllib.request.urlopen(req,timeout=30) as r: release=json.load(r)
          jars=[a for a in release.get('assets',[]) if a['name'].startswith('apktool_') and a['name'].endswith('.jar')]
          assert jars
          urllib.request.urlretrieve(jars[0]['browser_download_url'],'/tmp/apktool.jar')
          PY
          java -jar /tmp/apktool.jar --version

      - name: Reconstruct base APK
        run: |
          cat \
            network-fix/chunk_00.b64 \
            network-fix/chunk_01.b64 \
            network-fix/chunk_02.b64 \
            network-fix/chunk_03.b64 \
            network-fix/chunk_04a.b64 \
            network-fix/chunk_04b.b64 \
            network-fix/chunk_05.b64 \
            network-fix/chunk_06.b64 \
            network-fix/chunk_07.b64 \
            network-fix/chunk_08.b64 > /tmp/app.b64
          test "$(wc -c < /tmp/app.b64)" -eq 97800
          base64 -d /tmp/app.b64 > /tmp/app-base.apk
          unzip -t /tmp/app-base.apk

      - name: Inject v9 fixes and exact selected icon inside app
        run: |
          python3 - <<'PY'
          import zipfile, os
          src='/tmp/app-base.apk'; dst='/tmp/app-v10.apk'
          old_activity='com.godnit.networkacadfix.MainActivity'.encode('utf-16le')
          real_activity='com.godnit.networkacademy.MainActivity'.encode('utf-16le')
          old_pkg='com.godnit.networkacadfix'.encode('utf-16le')
          new_pkg='com.godnit.networkacadv10'.encode('utf-16le')
          assert len(old_activity)==len(real_activity)
          assert len(old_pkg)==len(new_pkg)
          names=['v5-fix.css','v5-fix.js','v6-guided.css','v6-guided.js','v7-foundations.css','v7-foundations.js','v7-hotfix.js','v8-polish.css','v8-polish.js','v9-beginner.css','v9-beginner.js']
          files={n:open('network-fix/'+n,'rb').read() for n in names}
          brand=open('network-fix/icon7/brand-icon-exact.svg','rb').read()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w') as zout:
              for info in zin.infolist():
                  if info.filename.startswith('META-INF/'): continue
                  data=zin.read(info.filename)
                  if info.filename=='AndroidManifest.xml':
                      assert data.count(old_activity)==1
                      data=data.replace(old_activity,real_activity)
                      assert data.count(old_pkg)==1
                      data=data.replace(old_pkg,new_pkg)
                  elif info.filename=='assets/index.html':
                      text=data.decode('utf-8')
                      text=text.replace('</head>','  <link rel="stylesheet" href="v5-fix.css" />\n  <link rel="stylesheet" href="v6-guided.css" />\n  <link rel="stylesheet" href="v7-foundations.css" />\n  <link rel="stylesheet" href="v8-polish.css" />\n  <link rel="stylesheet" href="v9-beginner.css" />\n</head>')
                      text=text.replace('</body>','  <script src="v5-fix.js"></script>\n  <script src="v6-guided.js"></script>\n  <script src="v7-foundations.js"></script>\n  <script src="v7-hotfix.js"></script>\n  <script src="v8-polish.js"></script>\n  <script src="v9-beginner.js"></script>\n</body>')
                      data=text.encode('utf-8')
                  elif info.filename=='assets/brand-icon.svg':
                      data=brand
                  zout.writestr(info,data)
              for name,data in files.items():
                  zout.writestr('assets/'+name,data,compress_type=zipfile.ZIP_DEFLATED)
          with zipfile.ZipFile(dst,'r') as z:
              assert z.read('assets/brand-icon.svg')==brand
              assert b'data:image/png;base64,' in brand
              assert b'Lcom/godnit/networkacademy/MainActivity;' in z.read('classes2.dex')
          print('v10 injected:',os.path.getsize(dst))
          PY
          unzip -t /tmp/app-v10.apk

      - name: Use the same exact image as Android launcher
        run: |
          java -jar /tmp/apktool.jar d -s -f /tmp/app-v10.apk -o /tmp/decoded
          python3 - <<'PY'
          import base64, pathlib
          svg=pathlib.Path('network-fix/icon7/brand-icon-exact.svg').read_text()
          payload=svg.split('data:image/png;base64,',1)[1].split('"',1)[0].strip()
          payload += '=' * ((4 - len(payload) % 4) % 4)
          png=base64.b64decode(payload,validate=False)
          assert png.startswith(b'\x89PNG\r\n\x1a\n')
          assert len(png)>20000
          out=pathlib.Path('/tmp/decoded/res/drawable-nodpi')
          out.mkdir(parents=True,exist_ok=True)
          pathlib.Path('/tmp/decoded/res/drawable/ic_launcher.xml').unlink(missing_ok=True)
          (out/'ic_launcher.png').write_bytes(png)
          pathlib.Path('/tmp/decoded/assets/brand-icon.svg').write_text(svg)
          pathlib.Path('/tmp/exact-launcher.png').write_bytes(png)
          print('Exact launcher PNG bytes:',len(png))
          PY
          test -f /tmp/decoded/res/drawable-nodpi/ic_launcher.png
          java -jar /tmp/apktool.jar b /tmp/decoded -o /tmp/app-final-unsigned.apk
          unzip -t /tmp/app-final-unsigned.apk

      - name: Align APK
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 /tmp/app-final-unsigned.apk /tmp/app-aligned.apk
          "$ZIPALIGN" -c -v 4 /tmp/app-aligned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore /tmp/network-v10.keystore -storepass android -keypass android -alias networkv10 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Network Academy Exact Icon v10,O=Godnit,C=US"

      - name: Sign and verify APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$APKSIGNER" sign --ks /tmp/network-v10.keystore --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out Network_Academy_Exact_Icon_v10.apk /tmp/app-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs Network_Academy_Exact_Icon_v10.apk
          "$ZIPALIGN" -c -v 4 Network_Academy_Exact_Icon_v10.apk
          unzip -t Network_Academy_Exact_Icon_v10.apk
          unzip -l Network_Academy_Exact_Icon_v10.apk | grep -q 'res/drawable-nodpi/ic_launcher.png'
          unzip -p Network_Academy_Exact_Icon_v10.apk assets/brand-icon.svg | grep -q 'data:image/png;base64,'
          file Network_Academy_Exact_Icon_v10.apk
          sha256sum Network_Academy_Exact_Icon_v10.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Network-Academy-Exact-Icon-v10
          path: Network_Academy_Exact_Icon_v10.apk
          if-no-files-found: error
          retention-days: 7
