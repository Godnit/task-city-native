name: Build GoldEdge APK

on:
  push:
    branches: ["goldedge-app"]
    paths:
      - "goldedge/**"
      - ".github/workflows/build-goldedge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: goldedge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Test, lint and build
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GoldEdge-v1.0.0.apk
          sha256sum dist/GoldEdge-v1.0.0.apk > dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldEdge-v1.0.0
          path: |
            goldedge/dist/GoldEdge-v1.0.0.apk
            goldedge/dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
