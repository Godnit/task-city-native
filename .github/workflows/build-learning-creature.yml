name: Build Learning Creature APK

on:
  push:
    branches: [learning-creature-apk]
    paths:
      - 'learner/**'
      - 'settings-learning.gradle'
      - '.github/workflows/build-learning-creature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate simulation JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('learner/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/learning-creature.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/learning-creature.js

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        run: gradle --no-daemon --settings-file settings-learning.gradle :learner:assembleDebug

      - name: Verify APK archive
        run: unzip -t learner/build/outputs/apk/debug/learner-debug.apk

      - name: Verify embedded stage 2 simulation
        run: |
          unzip -p learner/build/outputs/apk/debug/learner-debug.apk assets/index.html | grep -q 'المرحلة الثانية'
          unzip -p learner/build/outputs/apk/debug/learner-debug.apk assets/index.html | grep -q 'هادئ جدًا 0.35×'
          unzip -p learner/build/outputs/apk/debug/learner-debug.apk assets/index.html | grep -q 'الصندوق ثقيل'
          unzip -p learner/build/outputs/apk/debug/learner-debug.apk assets/index.html | grep -q 'رف الأدوات'

      - name: Prepare APK
        run: cp learner/build/outputs/apk/debug/learner-debug.apk Learning-Creature-v0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learning-Creature-v0.3
          path: Learning-Creature-v0.3.apk
          if-no-files-found: error
          retention-days: 30
