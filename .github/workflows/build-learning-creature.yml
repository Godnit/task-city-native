name: Build Learning Creature APK

on:
  push:
    branches: [learning-creature-apk]
    paths:
      - 'learner/**'
      - 'settings-learning.gradle'
      - '.github/workflows/build-learning-creature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build installable debug APK
        run: gradle --no-daemon --settings-file settings-learning.gradle :learner:assembleDebug

      - name: Verify APK archive
        run: unzip -t learner/build/outputs/apk/debug/learner-debug.apk

      - name: Prepare APK
        run: cp learner/build/outputs/apk/debug/learner-debug.apk Learning-Creature-v0.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learning-Creature-v0.2
          path: Learning-Creature-v0.2.apk
          if-no-files-found: error
          retention-days: 30
