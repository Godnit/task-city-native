<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>قرية المجتمع — Custom Engine</title>
<style>
  :root{--bg:#08131d;--panel:#0d1b27ee;--panel2:#132638;--line:#27485e;--text:#f4f7fa;--muted:#9eb0bd;--cyan:#48d7e8;--gold:#f2c34f;--good:#67d68c;--bad:#f36f73;--blue:#5eb4ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,"Noto Sans Arabic","Segoe UI",sans-serif;color:var(--text)}
  #game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;background:#10251a}
  #ui{position:fixed;inset:0;pointer-events:none}
  .topbar{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(180deg,#0a1621f5,#0c1b28ef);border-bottom:1px solid #203e50;display:grid;grid-template-columns:1.45fr repeat(5,.72fr) 54px;align-items:center;padding:6px 10px;gap:4px;box-shadow:0 5px 20px #0006;pointer-events:auto}
  .brand{text-align:right;padding-inline:6px;min-width:0}.brand b{display:block;font-size:16px;line-height:1.15;white-space:nowrap}.brand small{color:var(--muted);font-size:8.5px;white-space:nowrap}.metric{text-align:center;border-inline-start:1px solid #1e3545;min-width:0}.metric small{display:block;color:#9fb1bd;font-size:8px;line-height:1.1;white-space:nowrap}.metric strong{font-size:15px;font-weight:800;line-height:1.2}.metric.good strong{color:var(--good)}.metric.gold strong{color:var(--gold)}.metric.cyan strong{color:var(--cyan)}
  button{font:inherit;color:inherit;border:0;cursor:pointer}.lang{height:38px;border-radius:10px;background:#15364b;border:1px solid #28566d;font-size:13px;font-weight:800;pointer-events:auto}
  .mission{position:absolute;top:68px;right:10px;width:min(360px,calc(100vw - 20px));min-height:60px;background:linear-gradient(135deg,#0e1a26ed,#142535e9);border:1px solid #28465b;border-radius:12px;box-shadow:0 8px 20px #0005;display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;pointer-events:auto}.mission small{color:var(--cyan);font-size:9.5px;font-weight:800}.mission .txt{margin-top:3px;font-size:12px;line-height:1.35}.mission .progress{margin-top:3px;color:var(--gold);font-size:9.5px}.mission button{align-self:center;min-width:80px;height:34px;border-radius:9px;background:linear-gradient(180deg,#2f8bc3,#236f9d);box-shadow:0 4px 10px #0004;font-size:11px;font-weight:800}
  .inventory-btn{position:absolute;left:10px;bottom:10px;width:106px;height:42px;border-radius:11px;background:linear-gradient(180deg,#183d56,#11324a);border:1px solid #2c5b76;box-shadow:0 6px 16px #0007;font-size:12px;font-weight:800;pointer-events:auto}.inventory-btn::before{content:"▣";margin-left:7px;color:var(--gold)}
  .panel{position:absolute;top:68px;left:10px;width:min(310px,88vw);height:calc(100vh - 80px);background:#0c1823f3;border:1px solid #29495e;border-radius:13px;box-shadow:0 10px 28px #0007;pointer-events:auto;overflow:hidden;display:none}.panel.show{display:block}.panel-head{height:48px;padding:10px 12px;border-bottom:1px solid #253e4f;display:flex;align-items:center;justify-content:space-between}.panel-head b{font-size:14px}.close{width:30px;height:30px;border-radius:8px;background:#1b3141}.list{height:calc(100% - 48px);overflow:auto;overscroll-behavior:contain;padding:8px 7px 22px;-webkit-overflow-scrolling:touch}.card{position:relative;min-height:66px;background:#132331;border:1px solid #2a4658;border-radius:10px;margin-bottom:7px;padding:9px 10px;display:grid;grid-template-columns:1fr 64px;gap:7px;align-items:center}.card.locked{opacity:.52}.card b{font-size:13px}.card small{display:block;margin-top:3px;color:#a9bac6;font-size:10px}.card .cost{color:var(--gold);margin-top:3px;font-size:10px}.card button{height:34px;border-radius:8px;background:#1f7850;font-size:11px;font-weight:800}.card.locked button{background:#394550}.world-tip{position:absolute;right:10px;bottom:10px;background:#0b1822b8;border:1px solid #2a485a;border-radius:9px;padding:6px 9px;color:#b8c7d1;font-size:9px;pointer-events:none}
  .selection{position:absolute;left:10px;top:68px;width:min(300px,88vw);background:#0c1823f3;border:1px solid #29495e;border-radius:13px;padding:10px;box-shadow:0 10px 28px #0007;display:none;pointer-events:auto}.selection.show{display:block}.selection h3{margin:0 0 4px;font-size:14px}.selection .meta{color:#9fb0bc;font-size:10px;line-height:1.45}.sel-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.sel-actions button{height:35px;border-radius:8px;font-size:11px;font-weight:800}.move{background:#256b94}.delete{background:#8b3d47}.close2{position:absolute;left:7px;top:7px;width:28px;height:28px;border-radius:8px;background:#1b3141}
  .placement{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;gap:7px;pointer-events:auto}.placement.show{display:flex}.placement button{height:38px;min-width:92px;border-radius:10px;font-size:11px;font-weight:800}.ok{background:#23875a}.cancel{background:#7b3c46}
  .home-screen{position:fixed;inset:0;z-index:200;display:grid;place-items:center;pointer-events:auto;overflow:hidden;background:radial-gradient(circle at 50% 25%,#315f47 0,#173829 32%,#091720 75%,#050b10 100%)}
  .home-screen.hide{display:none}.home-screen::before,.home-screen::after{content:"";position:absolute;width:52vw;height:52vw;max-width:720px;max-height:720px;border-radius:50%;filter:blur(1px);opacity:.18;background:#8dd35b}.home-screen::before{left:-18vw;bottom:-30vw}.home-screen::after{right:-20vw;top:-28vw;background:#43b9d4}.home-card{position:relative;width:min(430px,86vw);padding:28px 24px 24px;border:1px solid #31566b;border-radius:24px;background:linear-gradient(180deg,#0b1b28f3,#09141df5);box-shadow:0 24px 80px #000b;text-align:center}.home-mark{width:74px;height:74px;margin:0 auto 13px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#6fae47,#3f7b37);box-shadow:0 12px 28px #0007;font-size:34px}.home-card h1{margin:0;font-size:28px}.home-card p{margin:8px 0 22px;color:#a9bcc8;font-size:12px}.home-actions{display:grid;gap:10px}.home-actions button{height:50px;border-radius:14px;font-weight:800;border:1px solid #35627b}.home-actions .play{background:linear-gradient(180deg,#258e5f,#1e704d)}.home-actions .world{background:linear-gradient(180deg,#236f9e,#19577f)}.home-foot{margin-top:14px;color:#718693;font-size:9px}.menu-btn{position:absolute;left:68px;top:11px;width:38px;height:38px;z-index:2;border-radius:10px;background:#122d3d;border:1px solid #28546a;pointer-events:auto;font-size:16px}
  @media(max-width:800px){.topbar{height:56px;grid-template-columns:1.45fr repeat(3,.75fr) 48px;padding:5px 7px}.metric:nth-of-type(5),.metric:nth-of-type(6){display:none}.mission{top:63px;right:7px;width:min(315px,calc(100vw - 14px));padding:7px 8px}.panel,.selection{top:63px;height:calc(100vh - 72px)}.brand b{font-size:14px}.brand small{font-size:7.5px}.metric strong{font-size:14px}.metric small{font-size:7.5px}.lang{height:34px}.inventory-btn{left:7px;bottom:7px;width:98px;height:38px}.world-tip{right:7px;bottom:7px;max-width:48vw}.menu-btn{left:57px;top:9px;width:34px;height:34px}.home-card{padding:22px 18px 19px}.home-card h1{font-size:24px}}
  @media(max-height:500px){.topbar{height:52px}.mission{top:58px;min-height:52px;max-width:330px}.mission .txt{font-size:11px}.panel,.selection{top:58px;height:calc(100vh - 66px)}.home-card{transform:scale(.92)}}
</style>
</head>
<body>
<div class="home-screen" id="homeScreen">
  <div class="home-card">
    <div class="home-mark">🏘️</div>
    <h1 id="homeTitle">قرية المجتمع</h1>
    <p id="homeSub">ابنِ مجتمعك، طوّر الخدمات، وراقب حياة السكان.</p>
    <div class="home-actions">
      <button class="play" id="playBtn">بدء اللعب</button>
      <button class="world" id="openWorldBtn">فتح العالم</button>
    </div>
    <div class="home-foot">CUSTOM ENGINE • v2</div>
  </div>
</div>
<canvas id="game"></canvas>
<div id="ui">
  <div class="topbar">
    <div class="brand"><b>قرية المجتمع</b><small>وظائف • احتياجات • اقتصاد • مجتمع</small></div>
    <div class="metric cyan"><small>السكان</small><strong id="mPop">1</strong></div>
    <div class="metric gold"><small>المال</small><strong id="mMoney">185</strong></div>
    <div class="metric"><small>المستوى</small><strong id="mLevel">1</strong></div>
    <div class="metric good"><small>المدرس</small><strong id="mTeacher">30s</strong></div>
    <div class="metric cyan"><small>مواطن جديد</small><strong id="mNew">300s</strong></div>
    <button class="lang" id="langBtn">EN</button>
  </div>
  <button class="menu-btn" id="menuBtn" title="القائمة">☰</button>
  <div class="mission" id="missionBox"><div><small>المهمة الحالية</small><div class="txt" id="missionText">انتظر وصول المدرس.</div><div class="progress" id="missionProgress">30s</div></div><button id="missionAction" style="display:none">ابدأ المهمة</button></div>
  <button class="inventory-btn" id="inventoryBtn">المخزن</button>
  <div class="panel" id="inventoryPanel"><div class="panel-head"><b>مخزن البنايات</b><button class="close" id="inventoryClose">×</button></div><div class="list" id="inventoryList"></div></div>
  <div class="selection" id="selection"><button class="close2" id="selectionClose">×</button><h3 id="selTitle"></h3><div class="meta" id="selMeta"></div><div class="sel-actions"><button class="move" id="moveBtn">تحريك</button><button class="delete" id="deleteBtn">حذف</button></div></div>
  <div class="placement" id="placement"><button class="ok" id="placeOk">تأكيد</button><button class="cancel" id="placeCancel">إلغاء</button></div>
  <div class="world-tip">اسحب بإصبع لتحريك العالم • إصبعان للتحريك والتقريب/الإبعاد</div>
</div>
<script src="app.js"></script>
</body>
</html>
