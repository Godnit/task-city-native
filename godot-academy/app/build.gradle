plugins { id 'com.android.application' }

android {
    namespace 'com.godnit.godotacademy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.godotacademy'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '5.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
