plugins {
    id 'com.android.application'
}

android {
    namespace 'com.masari.personalplan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.masari.personalplan'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '0.12.0'
    }

    sourceSets {
        main {
            java {
                exclude '**/MasariProActivity.java'
                exclude '**/ProfessionalDashboardActivity.java'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file('../signing/masari-release.keystore')
            storePassword 'android'
            keyAlias 'masari'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
