plugins {
    id 'com.android.application'
}

android {
    namespace 'com.godnit.ourrealm'
    compileSdk 35

    defaultConfig {
        applicationId 'com.godnit.ourrealm'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
